<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light only" />
    <script src="https://cdn.plot.ly/plotly-3.4.0.min.js"></script>
    <style>
        :root {
            /* --bg e --card eram diferentes (cinzento vs branco) e criavam uma costura visível
               entre a página e a caixa do painel - unificadas na mesma cor (ver pedido de
               layout minimalista, mesma lógica já aplicada a population_dashboard.html). */
            --bg: #ffffff;
            --card: #ffffff;
            --ink: #222222;
            --muted: #5a6573;
            --border: #dde2e8;
            --accent: #145da0;
            color-scheme: light only;
        }
        html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font-family: Segoe UI, Tahoma, sans-serif; }
        .container { max-width: 1360px; margin: 0 auto; padding: 24px 16px 40px; }
        h1 { margin: 0 0 8px; color: var(--accent); font-size: 1.55rem; }
        p { margin: 0 0 20px; color: var(--muted); }
        /* Painel sem caixa (sem borda/fundo próprio) - só o título e o gráfico, já que a página
           inteira partilha agora a mesma cor de fundo do cartão. */
        .panel { overflow: hidden; margin-bottom: 16px; }
        .panel h2 { margin: 0; padding: 0 0 10px; font-size: 1rem; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
        .plot { width: 100%; height: 560px; }
        .plot, .plot * { forced-color-adjust: none !important; }
        .opt-note-bar {
            background: linear-gradient(180deg, #ffffff, #f3f7fb);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 16px;
        }
        .opt-note {
            margin: 0;
            color: var(--muted);
            line-height: 1.45;
        }
        /* Só a opção selecionada tem cor (fundo sólido); a(s) outra(s) ficam com a cor do
           fundo (transparentes) e sem borda - nada de caixa/contorno à volta do grupo. */
        .opt-toggle {
            display: inline-flex;
            gap: 4px;
            border-radius: 999px;
            flex: 0 0 auto;
        }
        .opt-toggle button {
            border: 0;
            border-radius: 999px;
            background: transparent;
            color: var(--muted);
            padding: 6px 14px;
            font: inherit;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
        }
        .opt-toggle button:hover:not(.is-active) {
            background: rgba(20, 20, 30, 0.06);
        }
        .opt-toggle button.is-active {
            background: var(--accent);
            color: #ffffff;
        }
        .direction-heading {
            margin: 28px 0 12px;
            font-size: 1.1rem;
            color: var(--accent);
            border-top: 1px solid var(--border);
            padding-top: 20px;
        }
        @media (max-width: 860px) {
            .plot { height: 460px; }
            h1 { font-size: 1.25rem; }
        }
    </style>
</head>
<body>
    <main class="container">
        <div id="fwd-group">
            <section class="opt-note-bar" id="opt-note-bar" hidden>
                <p class="opt-note" id="opt-note"></p>
            </section>
            <section class="panel">
                <h2>
                    <span>Espera de transbordo (metro -&gt; autocarro)</span>
                    <span class="opt-toggle" data-figure="waits" data-plot="plot_waits" role="group" aria-label="Espera de transbordo: horário atual, otimizado ou melhorado" hidden></span>
                </h2>
                <div id="plot_waits" class="plot"></div>
            </section>
            <section class="panel">
                <h2>
                    <span>Equidade temporal (metro -&gt; autocarro)</span>
                    <span class="opt-toggle" data-figure="equity" data-plot="plot_equity" role="group" aria-label="Equidade temporal: horário atual, otimizado ou melhorado" hidden></span>
                </h2>
                <div id="plot_equity" class="plot"></div>
            </section>
        </div>

        <div id="rev-group" hidden>
            <h2 class="direction-heading">Sentido inverso: autocarro -&gt; metro</h2>
            <section class="opt-note-bar" id="opt-note-bar-rev" hidden>
                <p class="opt-note" id="opt-note-rev"></p>
            </section>
            <section class="panel">
                <h2>
                    <span>Espera de transbordo (autocarro -&gt; metro)</span>
                    <span class="opt-toggle" data-figure="waits" data-plot="plot_waits_rev" role="group" aria-label="Espera de transbordo (sentido inverso): horário atual, otimizado ou melhorado" hidden></span>
                </h2>
                <div id="plot_waits_rev" class="plot"></div>
            </section>
            <section class="panel">
                <h2>
                    <span>Equidade temporal (autocarro -&gt; metro)</span>
                    <span class="opt-toggle" data-figure="equity" data-plot="plot_equity_rev" role="group" aria-label="Equidade temporal (sentido inverso): horário atual, otimizado ou melhorado" hidden></span>
                </h2>
                <div id="plot_equity_rev" class="plot"></div>
            </section>
        </div>
    </main>

r":"white","linecolor":"white","ticks":"","title":{"standoff":15},"zerolinecolor":"white","automargin":true,"zerolinewidth":2},"yaxis":{"gridcolor":"white","linecolor":"white","ticks":"","title":{"standoff":15},"zerolinecolor":"white","automargin":true,"zerolinewidth":2},"scene":{"xaxis":{"backgroundcolor":"#E5ECF6","gridcolor":"white","linecolor":"white","showbackground":true,"ticks":"","zerolinecolor":"white","gridwidth":2},"yaxis":{"backgroundcolor":"#E5ECF6","gridcolor":"white","linecolor":"white","showbackground":true,"ticks":"","zerolinecolor":"white","gridwidth":2},"zaxis":{"backgroundcolor":"#E5ECF6","gridcolor":"white","linecolor":"white","showbackground":true,"ticks":"","zerolinecolor":"white","gridwidth":2}},"shapedefaults":{"line":{"color":"#2a3f5f"}},"annotationdefaults":{"arrowcolor":"#2a3f5f","arrowhead":0,"arrowwidth":1},"geo":{"bgcolor":"white","landcolor":"#E5ECF6","subunitcolor":"white","showland":true,"showlakes":true,"lakecolor":"white"},"title":{"x":0.05},"mapbox":{"style":"light"}}},"title":{"text":"Equidade Temporal de Liga\u00e7\u00f5es - sentido inverso (2026-05-11)"},"xaxis":{"title":{"text":"Per\u00edodo"}},"yaxis":{"title":{"text":"M\u00e9trica"}},"plot_bgcolor":"white"}};
        const variantsFwd = {"modes": ["atual", "otimizado", "melhorado"], "labels": {"atual": "Atual", "otimizado": "Otimizado", "melhorado": "Melhorado"}, "notes": {"otimizado": "Otimizado (linha 54, desvio de -10 min face ao horário atual, mesmas 21 viagens/dia e mesmo ciclo de 40 min - sem autocarros ou motoristas extra; horário noturno fora de âmbito por agora): espera mediana 26.0 -> 25.2 min, cobertura <=10min 21.0% -> 21.0%.", "melhorado": "Melhorado (linha 54 com 2 autocarros no mesmo ciclo de 40 min (desfasados 20 min - frequência 40->20 min), desvio de +0 min, 21 -> 42 viagens/dia - implica +1 autocarro/motorista face ao atual; horário noturno fora de âmbito por agora): espera mediana 26.0 -> 15.0 min, cobertura <=10min 21.0% -> 41.9%."}, "waits": {"atual": [0, 1, 2, 3], "otimizado": [4, 5, 6], "melhorado": [7, 8, 9, 10]}, "equity": {"atual": [0], "otimizado": [1], "melhorado": [2]}};
        const variantsRev = {"modes": ["atual", "otimizado", "melhorado"], "labels": {"atual": "Atual", "otimizado": "Otimizado", "melhorado": "Melhorado"}, "notes": {"otimizado": "Otimizado (linha 54, desvio de -10 min face ao horário atual, mesmas 21 viagens/dia e mesmo ciclo de 40 min - sem autocarros ou motoristas extra; horário noturno fora de âmbito por agora): espera mediana 2.0 -> 2.0 min, cobertura <=10min 90.5% -> 100.0%.", "melhorado": "Melhorado (linha 54 com 2 autocarros no mesmo ciclo de 40 min (desfasados 20 min - frequência 40->20 min), desvio de +0 min, 21 -> 42 viagens/dia - implica +1 autocarro/motorista face ao atual; horário noturno fora de âmbito por agora): espera mediana 2.0 -> 2.0 min, cobertura <=10min 90.5% -> 95.2%."}, "waits": {"atual": [0, 1], "otimizado": [2], "melhorado": [3, 4]}, "equity": {"atual": [0], "otimizado": [1], "melhorado": [2]}};
        const cfg = { responsive: true };

        if (hasReverse) {
            document.getElementById('rev-group').hidden = false;
        }

        const allFigs = [
            ['plot_waits', figWaits],
            ['plot_equity', figEquity],
        ];
        if (hasReverse) {
            allFigs.push(['plot_waits_rev', figWaitsRev]);
            allFigs.push(['plot_equity_rev', figEquityRev]);
        }

        function pad2(v) {
            return String(v).padStart(2, '0');
        }

        function nearestBusinessDayStr(now) {
            const d = new Date(now.getTime());
            const wd = d.getDay();
            if (wd === 6) d.setDate(d.getDate() - 1);
            else if (wd === 0) d.setDate(d.getDate() + 1);
            return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
        }

        function replaceDateSuffix(text, dayStr) {
            if (!text) return text;
            const re = /\(\d{4}-\d{2}-\d{2}\)$/;
            if (re.test(text)) return text.replace(re, `(${dayStr})`);
            return `${text} (${dayStr})`;
        }

        function updateFigTitle(fig, dayStr) {
            fig.layout = fig.layout || {};
            fig.layout.title = fig.layout.title || {};
            if (typeof fig.layout.title === 'string') {
                fig.layout.title = replaceDateSuffix(fig.layout.title, dayStr);
            } else {
                fig.layout.title.text = replaceDateSuffix(fig.layout.title.text || '', dayStr);
            }
        }

        function applyAutoBusinessDay() {
            const dayStr = nearestBusinessDayStr(new Date());
            const titleEl = document.getElementById('dashboard-title');
            if (titleEl) titleEl.textContent = replaceDateSuffix(titleEl.textContent, dayStr);
            document.title = replaceDateSuffix(document.title, dayStr);
            allFigs.forEach(([, fig]) => updateFigTitle(fig, dayStr));
        }

        applyAutoBusinessDay();
        allFigs.forEach(([plotId, fig]) => {
            Plotly.newPlot(plotId, fig.data, fig.layout, cfg);
        });

        setInterval(() => {
            applyAutoBusinessDay();
            allFigs.forEach(([plotId, fig]) => {
                Plotly.relayout(plotId, fig.layout);
            });
        }, 60000);

        // Comparação "horário atual vs. propostas otimizada/melhorada" - as figuras já trazem
        // todas as versões embutidas como traces extra (visible=false por omissão). Cada
        // visualização tem o seu próprio grupo de botões (Atual/Otimizado/Melhorado),
        // independente das outras - assim dá para, por exemplo, comparar a espera atual lado a
        // lado com a equidade já melhorada. `payload` vem de `_build_direction_figures`
        // (`variants` em integration.py): chaves `modes` (ordem dos botões), `labels` (texto de
        // cada botão), `notes` (texto da barra de nota por modo, opcional) e `waits`/`equity`
        // (índices de traces por modo, por figura). Partilhado pelos dois sentidos (metro->bus e
        // bus->metro), chamado uma vez por cada.
        function wireVariantToggles(scopeEl, payload, noteBarId, noteId) {
            if (!payload) return;
            const modes = payload.modes || ['atual'];
            const labels = payload.labels || {};
            const notes = payload.notes || {};
            const indicesByFigure = {
                waits: payload.waits || {},
                equity: payload.equity || {},
            };

            function updateNote(mode) {
                const bar = document.getElementById(noteBarId);
                const noteEl = document.getElementById(noteId);
                if (!bar || !noteEl) return;
                const text = notes[mode];
                if (text) {
                    noteEl.textContent = text;
                    bar.hidden = false;
                } else {
                    bar.hidden = true;
                }
            }

            scopeEl.querySelectorAll('.opt-toggle[data-figure]').forEach((toggle) => {
                const figureKey = toggle.dataset.figure;
                const plotId = toggle.dataset.plot;
                const idxByMode = indicesByFigure[figureKey] || {};
                const availableModes = modes.filter((m) => (idxByMode[m] || []).length);
                if (availableModes.length < 2) return; // só "atual" tem traces - nada para alternar

                toggle.hidden = false;
                toggle.innerHTML = '';
                availableModes.forEach((mode, i) => {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'opt-toggle-btn' + (i === 0 ? ' is-active' : '');
                    btn.dataset.mode = mode;
                    btn.textContent = labels[mode] || mode;
                    btn.addEventListener('click', () => {
                        availableModes.forEach((m) => {
                            const idxs = idxByMode[m] || [];
                            if (idxs.length) Plotly.restyle(plotId, { visible: m === mode }, idxs);
                        });
                        toggle.querySelectorAll('.opt-toggle-btn').forEach((b) => b.classList.toggle('is-active', b === btn));
                        updateNote(mode);
                    });
                    toggle.appendChild(btn);
                });
            });

            updateNote('atual');
        }

        wireVariantToggles(document.getElementById('fwd-group'), variantsFwd, 'opt-note-bar', 'opt-note');
        if (hasReverse) {
            wireVariantToggles(document.getElementById('rev-group'), variantsRev, 'opt-note-bar-rev', 'opt-note-rev');
        }
    </script>
