<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>SMTUC: Mockups da apresentação</title>
    <!-- Tipografia e cores inspiradas em cm-coimbra.pt/comovou (a comunicação oficial da própria
         Câmara sobre esta mesma fase 2 do Metrobus): títulos grandes em monospace (Space Mono),
         corpo de texto em Inter Tight, base quase-preta com acentos em amarelo/âmbar/azul-céu.
         Só a "casca" da página muda aqui - nenhuma visualização em si (os iframes) é alterada,
         só como se integram na página (cartões claros a flutuar sobre a base escura, para o
         fundo branco de cada mapa/gráfico não ficar cortado a direito contra o escuro). -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Tokens pensados para o CANVAS escuro (a página em si) - --ink/--muted/--border
               ficam claros aqui de propósito. Dentro de qualquer cartão claro (.card,
               .frame-card, .panel-note, etc.) estes 3 são redefinidos localmente mais abaixo
               para as versões escuras-sobre-branco - o resto do CSS (e o JS que gera os
               painéis) usa sempre os MESMOS var(--ink)/var(--muted)/var(--border) sem saber em
               que fundo está; é essa redefinição por âmbito que resolve os dois contrastes. */
            --page-bg: #16130f;
            --page-bg-2: #1d1811;
            --ink: #f5f3ee;
            --muted: rgba(245, 243, 238, 0.68);
            --border: rgba(245, 243, 238, 0.16);
            --card: #ffffff;
            --card-soft: #faf8f4;
            --accent: #ffdd2b;
            --accent-ink: #221d13;
            --accent-2: #ffb500;
            --shadow: 0 22px 48px rgba(0, 0, 0, 0.38);
            --font-head: 'Space Mono', 'Courier New', monospace;
            --font-body: 'Inter Tight', 'Segoe UI', Tahoma, sans-serif;
            color-scheme: dark;
        }
        /* Redefine os 3 tokens de texto/fronteira para as suas versões "sobre branco" dentro de
           qualquer cartão claro - ver comentário em :root. */
        .card, .frame-card, .step {
            --ink: #221d13;
            --muted: #5c574c;
            --border: #e7e2d8;
        }
        html, body {
            margin: 0;
            padding: 0;
            background: var(--page-bg);
            color: var(--ink);
            font-family: var(--font-body);
        }
        .shell {
            max-width: 1520px;
            margin: 0 auto;
            padding: 22px 16px 40px;
        }
        .hero {
            padding: 12px 4px 8px;
        }
        .eyebrow {
            display: inline-flex;
            gap: 8px;
            align-items: center;
            padding: 6px 10px;
            border-radius: 999px;
            background: var(--accent);
            color: var(--accent-ink);
            font-family: var(--font-head);
            font-size: 0.76rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 12px;
        }
        h1 {
            margin: 0;
            font-family: var(--font-head);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: -0.01em;
            font-size: clamp(1.5rem, 2.6vw, 2.35rem);
            line-height: 1.15;
            border-left: 6px solid var(--accent);
            padding-left: 16px;
        }
        .hero p {
            margin: 12px 0 0 22px;
            max-width: 980px;
            line-height: 1.55;
            color: var(--muted);
        }
        .tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin: 22px 0 16px;
        }
        .tab-btn {
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.06);
            color: var(--ink);
            font: inherit;
            font-family: var(--font-head);
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            border-radius: 999px;
            padding: 10px 16px;
            cursor: pointer;
            transition: transform 140ms ease, background 140ms ease, color 140ms ease, border-color 140ms ease;
        }
        .tab-btn:hover {
            transform: translateY(-1px);
            background: rgba(255, 255, 255, 0.11);
            border-color: var(--accent);
        }
        .tab-btn[aria-selected="true"] {
            background: var(--accent);
            color: var(--accent-ink);
            border-color: var(--accent);
        }
        .tab-panels {
            margin-top: 6px;
        }
        .tab-panel {
            display: none;
        }
        .tab-panel.is-active {
            display: block;
            animation: fadeIn 160ms ease-out;
        }
        .panel-head {
            padding: 10px 2px 16px;
        }
        .panel-title {
            margin: 0 0 6px;
            font-family: var(--font-head);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: -0.005em;
            font-size: clamp(1.15rem, 1.8vw, 1.5rem);
            color: var(--ink);
            border-left: 5px solid var(--accent-2);
            padding-left: 13px;
        }
        .panel-desc {
            margin: 0 0 0 18px;
            color: var(--muted);
            line-height: 1.5;
            max-width: 900px;
        }
        .panel-body {
            padding: 2px 2px 20px;
        }
        /* Notas, "versão otimizada", tabelas e cabeçalho de coluna ficam ESCUROS (tom do
           canvas) - só .card/.frame-card continuam claros, porque o conteúdo lá dentro
           (gráfico/mapa) já é branco por si; o resto do texto acompanha o fundo escuro. */
        .panel-note {
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.05);
            border-radius: 18px;
            padding: 14px 16px;
            color: var(--muted);
            line-height: 1.5;
            margin-bottom: 14px;
            box-shadow: var(--shadow);
        }
        .chip-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }
        .chip {
            display: inline-flex;
            align-items: center;
            border-radius: 999px;
            padding: 5px 11px;
            background: rgba(255, 181, 0, 0.14);
            color: #8a5f00;
            font-family: var(--font-head);
            font-size: 0.74rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }
        /* Dentro de cartões escuros (fecho/agradecimentos) os chips invertem para claro-sobre-
           escuro, em vez de herdar o par âmbar-sobre-branco pensado para cartões claros. */
        .closing-hero .chip-row .chip,
        .thanks-card .chip-row .chip {
            background: rgba(255, 255, 255, 0.14);
            color: #ffffff;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 16px;
        }
        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 16px;
        }
        .grid-hero {
            display: grid;
            grid-template-columns: 1.15fr 0.85fr;
            gap: 16px;
        }
        .card {
            border: 1px solid var(--border);
            border-radius: 18px;
            background: var(--card);
            overflow: hidden;
            box-shadow: var(--shadow);
        }
        /* Cartões que ficam ao lado de um cartão de abertura escuro (hero-card / closing-hero,
           ver kind==="hero"/"closing" no JS) ficam ESCUROS (tom do canvas), não brancos como os
           restantes cartões - texto curto lê-se bem sobre o fundo escuro e evita 3 blocos
           brancos a competir visualmente com o cartão principal ao lado. */
        .metric-card,
        .closing-card {
            border: 1px solid var(--border);
            border-left: 4px solid var(--accent);
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.05);
            overflow: hidden;
            box-shadow: var(--shadow);
        }
        .metric-card .lead-text,
        .closing-card .lead-text {
            font-weight: 500;
        }
        /* Mesmo reforço tipográfico dado ao texto das duas caixas acima - texto a 400 (normal)
           fica com pouca presença sobre fundo escuro translúcido; 500 dá a estas caixas escuras
           (nota, versão otimizada, subtítulo de coluna) o mesmo registo visual. */
        .panel-note,
        .target-card,
        .comparison-heading p {
            font-weight: 500;
        }
        /* Slide "Introdução" - o cartão principal (título grande da apresentação) fica escuro
           de propósito, como abertura de maior impacto (ver kind==="hero" no JS), distinto dos
           restantes cartões (claros) que levam conteúdo/dados a seguir. */
        .hero-card {
            background: linear-gradient(165deg, var(--page-bg-2), #100d09);
            border-color: rgba(255, 255, 255, 0.10);
        }
        .hero-card, .hero-card .lead-text {
            --ink: #f5f3ee;
            --muted: rgba(245, 243, 238, 0.72);
            --border: rgba(245, 243, 238, 0.16);
        }
        /* Visualizações (iframes) apresentadas como cartão claro arredondado a flutuar sobre o
           fundo escuro - o fundo branco do mapa/gráfico deixa de "cortar" contra o escuro e
           ganha a mesma moldura que o resto do conteúdo. */
        .frame-card {
            border: 1px solid var(--border);
            border-radius: 16px;
            background: var(--card);
            box-shadow: var(--shadow);
            overflow: hidden;
        }
        .card-head {
            padding: 12px 14px;
            border-bottom: 1px solid var(--border);
            background: var(--card-soft);
        }
        .frame-head {
            padding: 12px 14px;
            border-bottom: 1px solid var(--border);
            background: var(--card-soft);
        }
        .card-head h3,
        .frame-head h3,
        .metric-card h3 {
            margin: 0;
            font-family: var(--font-head);
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.02em;
            color: #8a5f00;
        }
        .card-body,
        .metric-body {
            padding: 16px;
        }
        .lead-text {
            font-size: 1.03rem;
            line-height: 1.55;
            color: var(--ink);
            margin: 0 0 14px;
        }
        .bullet-list {
            margin: 0;
            padding-left: 18px;
            color: var(--muted);
            line-height: 1.55;
        }
        .bullet-list li + li {
            margin-top: 8px;
        }
        .steps {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 14px;
        }
        .step {
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 9px 12px;
            background: var(--card-soft);
            color: var(--ink);
            font-family: var(--font-head);
            font-weight: 700;
            font-size: 0.85rem;
        }
        .frame-shell {
            padding: 0;
        }
        .frame-shell iframe {
            width: 100%;
            height: 500px;
            border: 0;
            display: block;
            background: #ffffff;
        }
        .frame-shell.tall iframe {
            height: 560px;
        }
        .frame-shell.slim iframe {
            height: 420px;
        }
        .metric-card .frame-shell iframe {
            height: 440px;
        }
        .comparison-col {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        /* Cabeçalho de coluna (Portagem/Portela) como cartão claro - antes ficava só texto
           solto sobre o fundo escuro, destoando do frame-card (com caixa) logo a seguir. */
        .comparison-heading {
            margin: 0;
            border: 1px solid var(--border);
            border-left: 4px solid var(--accent);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 14px;
            box-shadow: var(--shadow);
        }
        .comparison-heading h3 {
            margin: 0 0 2px;
            font-family: var(--font-head);
            text-transform: uppercase;
            font-size: 0.92rem;
            color: var(--ink);
        }
        .comparison-heading p {
            margin: 0;
            color: var(--muted);
            font-size: 0.9rem;
        }
        .frame-caption {
            margin: 0;
            padding: 10px 14px 14px;
            color: var(--muted);
            font-size: 0.86rem;
            line-height: 1.45;
            font-style: italic;
        }
        .target-card {
            border: 1px dashed var(--border);
            background: rgba(255, 255, 255, 0.05);
            border-radius: 18px;
            padding: 14px 16px;
            color: var(--muted);
            line-height: 1.5;
            box-shadow: var(--shadow);
        }
        .target-card h4 {
            margin: 0 0 8px;
            color: var(--ink);
            font-family: var(--font-head);
            text-transform: uppercase;
            font-size: 0.88rem;
        }
        .target-card ul {
            margin: 0;
            padding-left: 18px;
        }
        .target-card li + li {
            margin-top: 6px;
        }
        /* Seletor de cenário (Antes / Fase 2) por cima do iframe de uma coluna do slide de
           integração - ver "scenarios" em presentation_content.py. */
        .scenario-switch {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5em;
        }
        .scenario-btn {
            font-family: var(--font-head);
            font-weight: 700;
            font-size: 0.85em;
            text-transform: uppercase;
            padding: 0.4em 1em;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--ink);
            cursor: pointer;
        }
        .scenario-btn[aria-pressed="true"] {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--accent-ink);
        }
        .scenario-btn:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }
        .scenario-maps {
            margin-top: 0.875rem;
        }
        .stats-wrap {
            margin-top: 14px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }
        .stats-card {
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.05);
            box-shadow: var(--shadow);
        }
        .stats-card h4 {
            margin: 0;
            padding: 10px 12px;
            font-family: var(--font-head);
            text-transform: uppercase;
            font-size: 0.82rem;
            border-bottom: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.06);
        }
        .stats-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.84rem;
        }
        .stats-table th,
        .stats-table td {
            text-align: center;
            padding: 7px 8px;
            border-bottom: 1px solid var(--border);
            color: var(--ink);
        }
        .stats-table th {
            color: var(--muted);
            background: rgba(255, 255, 255, 0.06);
            font-weight: 600;
        }
        .closing-layout {
            display: grid;
            grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr);
            gap: 16px;
        }
        .closing-hero {
            border-radius: 20px;
            border-top: 5px solid var(--accent);
            background: linear-gradient(165deg, var(--page-bg-2), #100d09);
            color: #ffffff;
            padding: 22px 20px;
            box-shadow: var(--shadow);
        }
        .closing-hero h2 {
            margin: 0;
            font-family: var(--font-head);
            text-transform: uppercase;
            font-weight: 700;
            font-size: clamp(1.3rem, 2.1vw, 1.9rem);
            line-height: 1.2;
        }
        .closing-hero p {
            margin: 12px 0 0;
            color: rgba(255, 255, 255, 0.78);
            line-height: 1.55;
            max-width: 780px;
        }
        .closing-card {
            padding: 14px 16px;
        }
        .thanks-layout {
            min-height: 60vh;
            display: grid;
            place-items: center;
        }
        .thanks-card {
            width: min(920px, 100%);
            border-radius: 24px;
            border-top: 5px solid var(--accent);
            background: linear-gradient(165deg, var(--page-bg-2), #0d0b08);
            color: #ffffff;
            padding: 36px 28px;
            box-shadow: var(--shadow);
            text-align: center;
        }
        .thanks-card h2 {
            margin: 0;
            font-family: var(--font-head);
            text-transform: uppercase;
            font-weight: 700;
            font-size: clamp(1.7rem, 3.6vw, 2.7rem);
        }
        .thanks-card p {
            margin: 12px auto 0;
            max-width: 720px;
            color: rgba(255, 255, 255, 0.78);
            line-height: 1.55;
        }
        .thanks-card .chip-row {
            justify-content: center;
            margin-top: 16px;
        }
        /* Narrativa por secções (ver presentation_content.py): etiqueta de secção + cenário no
           topo de cada slide, divisores de secção, escada de cenários e slides por construir. */
        .section-tag {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            margin: 0 0 10px;
        }
        .section-num {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 2.2em;
            padding: 3px 9px;
            border-radius: 999px;
            background: var(--accent);
            color: var(--accent-ink);
            font-family: var(--font-head);
            font-weight: 700;
            font-size: 0.78rem;
        }
        .section-name {
            font-family: var(--font-head);
            font-weight: 700;
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--ink);
        }
        .ladder-chips {
            display: inline-flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
        }
        .ladder-chip {
            padding: 3px 10px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.06);
            color: var(--muted);
            font-size: 0.8rem;
        }
        .ladder-arrow {
            margin: 0 0.2em;
            color: var(--accent);
            font-family: var(--font-body);
            font-weight: 700;
        }
        .planned-badge {
            padding: 3px 10px;
            border-radius: 999px;
            border: 1px dashed var(--accent-2);
            color: var(--accent-2);
            font-family: var(--font-head);
            font-weight: 700;
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .section-divider {
            min-height: 62vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 18px;
        }
        .section-divider-head {
            display: flex;
            align-items: center;
            gap: 22px;
        }
        .section-big-num {
            font-family: var(--font-head);
            font-weight: 700;
            font-size: clamp(4rem, 9vw, 7.5rem);
            line-height: 1;
            color: var(--accent);
        }
        .section-divider-title {
            margin: 0;
            font-family: var(--font-head);
            font-weight: 700;
            text-transform: uppercase;
            font-size: clamp(1.8rem, 3.4vw, 2.8rem);
            line-height: 1.1;
        }
        .section-divider-period {
            margin: 6px 0 0;
            font-family: var(--font-head);
            color: var(--muted);
        }
        .section-question {
            margin: 0;
            max-width: 1000px;
            font-size: clamp(1.15rem, 1.7vw, 1.45rem);
            line-height: 1.4;
            font-weight: 500;
            border-left: 5px solid var(--accent-2);
            padding-left: 16px;
        }
        .section-divider .chip-row .chip {
            background: rgba(255, 255, 255, 0.14);
            color: #ffffff;
        }
        .ladder {
            list-style: none;
            margin: 0;
            padding: 0;
            display: grid;
            grid-template-columns: repeat(6, minmax(0, 1fr));
            gap: 10px;
        }
        .ladder-step {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 12px;
            border-radius: 14px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.03);
            opacity: 0.4;
        }
        .ladder-step.nature-planeado {
            border-style: dashed;
        }
        .ladder-step.is-on {
            opacity: 1;
            border-color: var(--accent);
            background: rgba(255, 221, 43, 0.10);
        }
        .ladder-step.is-context {
            opacity: 0.75;
        }
        .ladder-tag {
            font-family: var(--font-head);
            font-weight: 700;
            font-size: 1.5rem;
            line-height: 1;
            color: var(--accent);
        }
        .ladder-title {
            font-weight: 600;
        }
        .ladder-detail {
            color: var(--muted);
            font-size: 0.85rem;
            line-height: 1.35;
        }
        .ladder-meta {
            margin-top: auto;
            padding-top: 6px;
            color: var(--muted);
            font-family: var(--font-head);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }
        .ladder-map {
            list-style: none;
            margin: 16px 0 0;
            padding: 0;
            display: grid;
            gap: 8px;
        }
        .ladder-map li {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.04);
        }
        .ladder-map-compare {
            min-width: 5em;
            font-family: var(--font-head);
            font-weight: 700;
            color: var(--accent);
        }
        .ladder-map-question {
            flex: 1 1 320px;
            line-height: 1.4;
        }
        .pending-card {
            max-width: 1000px;
            border: 1px dashed var(--accent-2);
            border-radius: 18px;
            background: rgba(255, 181, 0, 0.06);
            padding: 16px 18px;
            line-height: 1.5;
            box-shadow: var(--shadow);
        }
        .pending-status {
            display: inline-block;
            margin-bottom: 10px;
            padding: 4px 10px;
            border-radius: 999px;
            background: var(--accent-2);
            color: var(--accent-ink);
            font-family: var(--font-head);
            font-weight: 700;
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .pending-card h4 {
            margin: 0 0 8px;

        const tabsEl = document.getElementById('dashboard-tabs');
        const panelsEl = document.getElementById('dashboard-panels');

        function esc(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function renderChips(items) {
            if (!Array.isArray(items) || !items.length) return '';
            return `<div class="chip-row">${items.map((item) => `<span class="chip">${esc(item)}</span>`).join('')}</div>`;
        }

        function renderIframeFrame(item, extraClass = '', options = {}) {
            const title = esc(item.title || item.label || 'Visualização');
            const src = esc(item.src || '');
            const bare = !!options.bare;
            const head = bare ? '' : `<div class="frame-head"><h3>${title}</h3></div>`;
            const caption = item.caption ? `<p class="frame-caption">${esc(item.caption)}</p>` : '';
            return `
                <article class="frame-card ${extraClass}">
                    ${head}
                    <div class="frame-shell ${extraClass}"><iframe title="${title}" loading="lazy" data-src="${src}" referrerpolicy="no-referrer"></iframe></div>
                    ${caption}
                </article>
            `;
        }

        function renderOverlapTable(rows) {
            const safeRows = Array.isArray(rows) ? rows : [];
            const body = safeRows.map((row) => `
                <tr>
                    <td>${esc(row.line || '-')}</td>
                    <td>${esc(row.overlap_pct || '-')}</td>
                    <td>${esc(row.overlap_m || '-')}</td>
                    <td>${esc(row.extension_m || '-')}</td>
                    <td>${esc(row.overlap_stops || '-')} / ${esc(row.total_stops || '-')}</td>
                    <td>${esc(row.avg_freq_min || '-')}</td>
                </tr>
            `).join('');

            return `
                <table class="stats-table">
                    <thead>
                        <tr>
                            <th>Linha</th>
                            <th>Overlap (%)</th>
                            <th>Overlap (m)</th>
                            <th>Extensão (m)</th>
                            <th>Paragens</th>
                            <th>Freq. média</th>
                        </tr>
                    </thead>
                    <tbody>${body}</tbody>
                </table>
            `;
        }

        function renderOverlapStats(item) {
            const stats = item && item.stats;
            if (!stats || (!Array.isArray(stats.top5) && !Array.isArray(stats.bottom5) && !Array.isArray(stats.bottom5_stadium))) {
                return '';
            }

            const temporal = stats.temporal_summary || {};
            const summary = temporal.total_spatial_candidates ? `
                <div class="panel-note" style="margin-top:14px;">
                    <strong>Resumo temporal:</strong> ${esc(temporal.temporal_overlap_pct || 0)}% das combinações espaciais passaram também o limiar temporal definido.
                </div>
            ` : '';
            const totalExtension = temporal.total_overlap_extension_fmt ? `
                <div class="panel-note" style="margin-top:14px;">
                    <strong>Extensão total em overlap:</strong> ${esc(temporal.total_overlap_extension_fmt)} de linhas SMTUC coincidem, a pé, com paragens do Metrobus (soma de todas as linhas com overlap).
                </div>
            ` : '';

            return `
                <section class="stats-wrap">
                    <div class="stats-grid">
                        <article class="stats-card">
                            <h4>Top 5 maior overlap</h4>
                            ${renderOverlapTable(stats.top5 || [])}
                        </article>
                        <article class="stats-card">
                            <h4>Bottom 5 menor overlap</h4>
                            ${renderOverlapTable(stats.bottom5_stadium || stats.bottom5 || [])}
                        </article>
                    </div>
                    ${summary}
                    ${totalExtension}
                </section>
            `;
        }

        // Botões que trocam o iframe de uma coluna entre cenários (column.scenarios; o 1.º abre).
        function renderScenarioSwitch(column) {
            const options = Array.isArray(column.scenarios) ? column.scenarios : [];
            if (options.length < 2) return '';
            return `<div class="scenario-switch" role="group" aria-label="Cenário">${options.map((opt, i) => `<button type="button" class="scenario-btn" data-scenario-src="${esc(opt.src || '')}" aria-pressed="${i === 0 ? 'true' : 'false'}">${esc(opt.label || '')}</button>`).join('')}</div>`;
        }

        function columnFrame(column) {
            const options = Array.isArray(column.scenarios) ? column.scenarios : [];
            const current = column.current || {};
            return options.length ? { ...current, src: options[0].src || current.src } : current;
        }

        // ---- Narrativa por secções (presentation_content.py; resolvida em
        // dashboard._attach_narrative). Mesmo código em feednplay_dashboard.html. ----
        const NATURE_LABELS = { oficial: 'dados oficiais', contrafactual: 'contrafactual', planeado: 'cenário planeado' };
        const PLANNED_BADGE = '<span class="planned-badge">Cenário planeado</span>';

        // Tags dos degraus ("A′", "B", ...) unidas por setas; devolve HTML já escapado (a seta vai
        // na fonte do corpo: o Space Mono não tem "→" e a de substituição sai minúscula).
        function ladderTags(ids, steps) {
            return (ids || []).map((id) => esc((steps.find((step) => step.id === id) || {}).tag || id)).join('<span class="ladder-arrow">→</span>');
        }

        // Etiqueta no topo de cada slide de uma secção: número + nome da secção + o(s) cenário(s)
        // que o slide mostra (+ selo se algum for planeado). Abertura/fecho não têm.
        function renderSectionTag(item) {
            const section = item.section_meta;
            if (!section) return '';
            const steps = Array.isArray(item.ladder_meta) ? item.ladder_meta : [];
            const chips = steps.length
                ? `<span class="ladder-chips">${steps.map((step) => `<span class="ladder-chip" title="${esc(step.detail)}">${esc(step.tag)} · ${esc(step.title)} · ${esc(step.day)}</span>`).join('<span class="ladder-arrow" aria-hidden="true">→</span>')}</span>`
                : '';
            const planned = steps.some((step) => step.nature === 'planeado');
            return `
                <div class="section-tag">
                    <span class="section-num">${esc(section.number)}</span>
                    <span class="section-name">${esc(section.title)}</span>
                    ${chips}
                    ${planned ? PLANNED_BADGE : ''}
                </div>
            `;
        }

        function panelHead(item) {
            return `
                        <div class="panel-head">
                            ${renderSectionTag(item)}
                            <h2 class="panel-title">${esc(item.label)}</h2>
                            <p class="panel-desc">${esc(item.description || '')}</p>
                        </div>
            `;
        }

        // Escada de cenários: "on" = degraus comparados, "context" = só contexto (destaque mais
        // fraco); sem nenhum dos dois (slide "Cenários") ficam todos acesos.
        function renderLadder(steps, on = [], context = []) {
            const highlight = on.length > 0 || context.length > 0;
            return `
                <ol class="ladder">
                    ${(steps || []).map((step) => {
                        const state = !highlight || on.includes(step.id) ? 'is-on' : (context.includes(step.id) ? 'is-context' : '');
                        const status = step.status && step.status !== 'existe' ? ` · ${esc(step.status)}` : '';
                        return `
                            <li class="ladder-step ${state} nature-${esc(step.nature)}">
                                <span class="ladder-tag">${esc(step.tag)}</span>
                                <span class="ladder-title">${esc(step.title)}</span>
                                <span class="ladder-detail">${esc(step.detail)}</span>
                                <span class="ladder-meta">${esc(step.day)} · ${esc(NATURE_LABELS[step.nature] || step.nature)}${status}</span>
                            </li>
                        `;
                    }).join('')}
                </ol>
            `;
        }

        function renderPanel(item) {
            const kind = item.kind || 'hero';

            if (kind === 'section') {
                const section = item.section_meta || {};
                const steps = Array.isArray(item.ladder_all) ? item.ladder_all : [];
                const compare = section.compare || [];
                const context = section.context || [];
                const compareChip = compare.length
                    ? `<span class="chip">${compare.length > 1 ? 'Comparação' : 'Cenário'}: ${ladderTags(compare, steps)}</span>`
                    : '';
                const contextChip = context.length
                    ? `<span class="chip">Contexto: ${ladderTags([...context, compare[0]], steps)}</span>`
                    : '';
                return `
                    <article class="tab-panel" id="panel-${esc(item.id)}" data-panel-id="${esc(item.id)}" role="tabpanel" aria-labelledby="tab-${esc(item.id)}" hidden>
                        <div class="panel-body section-divider">
                            <div class="section-divider-head">
                                <span class="section-big-num">${esc(section.number)}</span>
                                <div>
                                    <h2 class="section-divider-title">${esc(section.title)}</h2>
                                    <p class="section-divider-period">${esc(section.period || '')}</p>
                                </div>
                            </div>
                            <p class="section-question">${esc(section.question || '')}</p>
                            <div class="chip-row">
                                <span class="chip">Tese: ${esc(section.thesis || '')}</span>
                                ${compareChip}
                                ${contextChip}
                                ${section.planned ? PLANNED_BADGE : ''}
                            </div>
                            ${renderLadder(steps, compare, context)}
                            ${section.note ? `<div class="panel-note">${esc(section.note)}</div>` : ''}
                        </div>
                    </article>
                `;
            }

            if (kind === 'ladder') {
                const steps = Array.isArray(item.ladder_all) ? item.ladder_all : [];
                const sections = Array.isArray(item.sections_all) ? item.sections_all : [];
                return `
                    <article class="tab-panel" id="panel-${esc(item.id)}" data-panel-id="${esc(item.id)}" role="tabpanel" aria-labelledby="tab-${esc(item.id)}" hidden>
                        ${panelHead(item)}
                        <div class="panel-body">
                            <div class="panel-note">${esc(item.note || '')}</div>
                            ${renderLadder(steps)}
                            <ul class="ladder-map">
                                ${sections.map((section) => `
                                    <li>
                                        <span class="section-num">${esc(section.number)}</span>
                                        <span class="ladder-map-compare">${ladderTags(section.compare, steps)}</span>
                                        <span class="ladder-map-question">${esc(section.question || '')}</span>
                                        ${section.planned ? PLANNED_BADGE : ''}
                                    </li>
                                `).join('')}
                            </ul>
                        </div>
                    </article>
                `;
            }

            if (kind === 'pending') {
                return `
                    <article class="tab-panel" id="panel-${esc(item.id)}" data-panel-id="${esc(item.id)}" role="tabpanel" aria-labelledby="tab-${esc(item.id)}" hidden>
                        ${panelHead(item)}
                        <div class="panel-body">
                            <div class="pending-card">
                                <span class="pending-status">${esc(item.status || 'Por construir')}</span>
                                <h4>O que este slide vai mostrar</h4>
                                <ul>${(item.shows || []).map((point) => `<li>${esc(point)}</li>`).join('')}</ul>
                            </div>
                        </div>
                    </article>
                `;
            }

            if (kind === 'hero') {
                const highlights = Array.isArray(item.highlights) ? item.highlights : [];
                return `
                    <article class="tab-panel is-active" id="panel-${esc(item.id)}" data-panel-id="${esc(item.id)}" role="tabpanel" aria-labelledby="tab-${esc(item.id)}">
                        ${panelHead(item)}
                        <div class="panel-body">
                            <div class="grid-hero">
                                <div class="card hero-card">
                                    <div class="card-body">
                                        <div class="eyebrow">${esc(item.eyebrow || 'Apresentação')}</div>
                                        <h2 style="margin:0 0 10px;font-size:clamp(1.8rem,3vw,3rem);line-height:1.08;">${esc(item.title || '')}</h2>
                                        <p class="lead-text">${esc(item.subtitle || '')}</p>
                                        <p class="lead-text" style="color:var(--muted);margin-bottom:0;">${esc(item.lead || '')}</p>
                                        ${renderChips(item.chips || [])}
                                    </div>
                                </div>
                                <div class="comparison-col">
                                    ${highlights.map((text) => `
                                        <div class="metric-card">
                                            <div class="metric-body">
                                                <p class="lead-text" style="margin:0;">${esc(text)}</p>
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        </div>
                    </article>
                `;
            }

            if (kind === 'methodology') {
                return `
                    <article class="tab-panel" id="panel-${esc(item.id)}" data-panel-id="${esc(item.id)}" role="tabpanel" aria-labelledby="tab-${esc(item.id)}" hidden>
                        ${panelHead(item)}
                        <div class="panel-body">
                            <div class="grid-2">
                                <div class="card">
                                    <div class="card-body">
                                        <p class="lead-text">${esc(item.note || '')}</p>
                                        <div class="steps">${(item.steps || []).map((step) => `<span class="step">${esc(step)}</span>`).join('')}</div>
                                        ${renderChips(item.source_tags || [])}
                                    </div>
                                </div>
                                <div class="grid-2">
                                    ${(item.iframes || []).map((frame) => renderIframeFrame(frame, 'slim')).join('')}
                                </div>
                            </div>
                        </div>
                    </article>
                `;
            }

            if (kind === 'three-up') {
                return `
                    <article class="tab-panel" id="panel-${esc(item.id)}" data-panel-id="${esc(item.id)}" role="tabpanel" aria-labelledby="tab-${esc(item.id)}" hidden>
                        ${panelHead(item)}
                        <div class="panel-body">
                            <div class="panel-note">${esc(item.note || '')}</div>
                            <div class="grid-3">
                                ${(item.iframes || []).map((frame) => renderIframeFrame(frame, 'slim')).join('')}
                            </div>
                        </div>
                    </article>
                `;
            }

            if (kind === 'overlap') {
                return `
                    <article class="tab-panel" id="panel-${esc(item.id)}" data-panel-id="${esc(item.id)}" role="tabpanel" aria-labelledby="tab-${esc(item.id)}" hidden>
                        ${panelHead(item)}
                        <div class="panel-body">
                            <div class="panel-note">${esc(item.note || '')}</div>
                            <div class="grid-2">
                                ${(item.iframes || []).map((frame) => renderIframeFrame(frame, 'tall')).join('')}
                            </div>
                            ${renderOverlapStats(item)}
                        </div>
                    </article>
                `;
            }

            if (kind === 'scenario-compare') {
                return `
                    <article class="tab-panel" id="panel-${esc(item.id)}" data-panel-id="${esc(item.id)}" role="tabpanel" aria-labelledby="tab-${esc(item.id)}" hidden>
                        ${panelHead(item)}
                        <div class="panel-body">
                            <div class="panel-note">${esc(item.note || '')}</div>
                            ${item.table ? renderIframeFrame(item.table, 'tall') : ''}
                            <div class="grid-2 scenario-maps">
                                ${(item.iframes || []).map((frame) => renderIframeFrame(frame, 'tall')).join('')}
                            </div>
                        </div>
                    </article>
                `;
            }

            if (kind === 'comparison') {
                return `
                    <article class="tab-panel" id="panel-${esc(item.id)}" data-panel-id="${esc(item.id)}" role="tabpanel" aria-labelledby="tab-${esc(item.id)}" hidden>
                        ${panelHead(item)}
                        <div class="panel-body">
                            <div class="panel-note">${esc(item.note || '')}</div>
                            <div class="grid-2">
                                ${(item.columns || []).map((column) => `
                                    <div class="comparison-col">
                                        <div class="comparison-heading">
                                            <h3>${esc(column.title || '')}</h3>
                                            <p>${esc(column.subtitle || '')}</p>
                                        </div>
                                        ${renderScenarioSwitch(column)}
                                        ${renderIframeFrame(columnFrame(column), 'slim', { bare: true })}
                                        ${(column.optimized || []).length ? `
                                        <div class="target-card">
                                            <h4>${esc(column.optimized_title || 'Versão otimizada')}</h4>
                                            <ul>${column.optimized.map((point) => `<li>${esc(point)}</li>`).join('')}</ul>
                                        </div>` : ''}
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </article>
                `;
            }

            if (kind === 'closing') {
                return `
                    <article class="tab-panel" id="panel-${esc(item.id)}" data-panel-id="${esc(item.id)}" role="tabpanel" aria-labelledby="tab-${esc(item.id)}" hidden>
                        ${panelHead(item)}
                        <div class="panel-body">
                            <div class="closing-layout">
                                <div class="closing-hero">
                                    <h2>${esc(item.headline || '')}</h2>
                                    ${item.lead ? `<p>${esc(item.lead)}</p>` : ''}
                                </div>
                                <div class="comparison-col">
                                    ${(item.points || []).map((point) => `
                                        <div class="closing-card">
                                            <p class="lead-text" style="margin:0;">${esc(point)}</p>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        </div>
                    </article>
                `;
            }

            if (kind === 'thanks') {
                return `
                    <article class="tab-panel" id="panel-${esc(item.id)}" data-panel-id="${esc(item.id)}" role="tabpanel" aria-labelledby="tab-${esc(item.id)}" hidden>
                        ${panelHead(item)}
                        <div class="panel-body thanks-layout">
                            <div class="thanks-card">
                                <h2>${esc(item.title || 'Obrigado')}</h2>
                                <p>${esc(item.subtitle || '')}</p>
                                ${renderChips(item.contacts || [])}
                            </div>
                        </div>
                    </article>
                `;
            }

            return '';
        }

        function setActiveTab(tabId, focusButton = false) {
            const buttons = tabsEl.querySelectorAll('[data-tab-id]');
            const panels = panelsEl.querySelectorAll('[data-panel-id]');

            buttons.forEach((button) => {
                const active = button.dataset.tabId === tabId;
                button.setAttribute('aria-selected', active ? 'true' : 'false');
                button.tabIndex = active ? 0 : -1;
                if (active && focusButton) button.focus();
            });

            panels.forEach((panel) => {
                const active = panel.dataset.panelId === tabId;
                panel.classList.toggle('is-active', active);
                panel.hidden = !active;
                if (active) {
                    panel.querySelectorAll('iframe[data-src]').forEach((iframe) => {
                        if (!iframe.dataset.loaded) {
                            iframe.src = iframe.dataset.src;
                            iframe.dataset.loaded = '1';
                        }
                    });
                }
            });
        }

        // Quebra de linha na barra de tabs sempre que muda a secção (abertura, 1, 1.5, ..., fecho).
        function tabRowBreak(index) {
            if (index === 0) return '';
            const sectionOf = (item) => (item.section_meta ? item.section_meta.id : '');
            return sectionOf(tabs[index]) !== sectionOf(tabs[index - 1]) ? '<span class="tab-row-break" aria-hidden="true"></span>' : '';
        }

        function renderTabs() {
            tabsEl.innerHTML = tabs.map((item, index) => `
                ${tabRowBreak(index)}
                <button
                    class="tab-btn${item.kind === 'section' ? ' is-section' : ''}"
                    type="button"
                    role="tab"
                    id="tab-${esc(item.id)}"
                    data-tab-id="${esc(item.id)}"
                    aria-controls="panel-${esc(item.id)}"
                    aria-selected="${index === 0 ? 'true' : 'false'}"
                    tabindex="${index === 0 ? '0' : '-1'}"
                >
                    ${esc(item.label)}
                </button>
            `).join('');

            panelsEl.innerHTML = tabs.map((item, index) => {
                const html = renderPanel(item);
                if (index === 0) return html;
                return html.replace('tab-panel is-active', 'tab-panel').replace(' hidden', ' hidden');
            }).join('');

            tabsEl.querySelectorAll('[data-tab-id]').forEach((button) => {
                button.addEventListener('click', () => setActiveTab(button.dataset.tabId, false));
                button.addEventListener('keydown', (event) => {
                    const key = event.key;
                    if (key !== 'ArrowLeft' && key !== 'ArrowRight' && key !== 'Home' && key !== 'End') return;

                    const currentIndex = tabs.findIndex((item) => item.id === button.dataset.tabId);
                    if (currentIndex < 0) return;

                    let nextIndex = currentIndex;
                    if (key === 'ArrowLeft') nextIndex = (currentIndex - 1 + tabs.length) % tabs.length;
                    if (key === 'ArrowRight') nextIndex = (currentIndex + 1) % tabs.length;
                    if (key === 'Home') nextIndex = 0;
                    if (key === 'End') nextIndex = tabs.length - 1;

                    event.preventDefault();
                    setActiveTab(tabs[nextIndex].id, true);
                });
            });

            setActiveTab(tabs[0].id, false);
        }

        // Um só listener delegado para todos os seletores de cenário (os painéis são gerados por
        // innerHTML): troca o src do iframe da mesma coluna e marca o botão ativo.
        panelsEl.addEventListener('click', (event) => {
            const button = event.target.closest('[data-scenario-src]');
            if (!button) return;
            const column = button.closest('.comparison-col');
            const iframe = column && column.querySelector('iframe');
            if (!iframe) return;
            column.querySelectorAll('[data-scenario-src]').forEach((b) => b.setAttribute('aria-pressed', b === button ? 'true' : 'false'));
            iframe.dataset.src = button.dataset.scenarioSrc;
            iframe.dataset.loaded = '1';
            iframe.src = button.dataset.scenarioSrc;
        });

        renderTabs();
    </script>
</body>
</html>
