<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light only" />
    <title>SMTUC: Mockups da apresentação</title>
    <style>
        :root {
            --bg: #f7f4ff;
            --bg-2: #f2edf9;
            --card: #ffffff;
            --card-soft: #fcfaff;
            --ink: #16202c;
            --muted: #5d6878;
            --border: #e7dff2;
            --accent: #6a0dad;
            --accent-2: #2d8f85;
            --accent-3: #0f5b9c;
            --shadow: 0 18px 50px rgba(106, 13, 173, 0.10);
            color-scheme: light only;
        }
        html, body {
            margin: 0;
            padding: 0;
            background:
                radial-gradient(circle at top left, rgba(15, 91, 156, 0.12), transparent 30%),
                radial-gradient(circle at top right, rgba(45, 143, 133, 0.10), transparent 26%),
                linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
            color: var(--ink);
            font-family: Segoe UI, Tahoma, sans-serif;
        }
        .shell {
            max-width: 1520px;
            margin: 0 auto;
            padding: 22px 16px 40px;
        }
        .hero {
            background: linear-gradient(135deg, rgba(106, 13, 173, 0.98), rgba(15, 91, 156, 0.96));
            color: #ffffff;
            border-radius: 24px;
            padding: 22px 24px 20px;
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
        }
        .hero::after {
            content: "";
            position: absolute;
            right: -120px;
            bottom: -120px;
            width: 280px;
            height: 280px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.10);
            filter: blur(2px);
        }
        .eyebrow {
            display: inline-flex;
            gap: 8px;
            align-items: center;
            padding: 6px 10px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.14);
            font-size: 0.82rem;
            letter-spacing: 0.02em;
            margin-bottom: 10px;
        }
        h1 {
            margin: 0;
            font-size: clamp(1.6rem, 2.8vw, 2.55rem);
            line-height: 1.08;
            position: relative;
            z-index: 1;
        }
        .hero p {
            margin: 10px auto 0;
            max-width: 980px;
            line-height: 1.5;
            color: rgba(255, 255, 255, 0.90);
            position: relative;
            z-index: 1;
        }
        .tabs {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 18px 0 14px;
        }
        .tab-btn {
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.82);
            color: var(--ink);
            border-radius: 999px;
            padding: 11px 16px;
            font: inherit;
            cursor: pointer;
            transition: transform 140ms ease, box-shadow 140ms ease, background 140ms ease, color 140ms ease;
        }
        .tab-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(19, 33, 57, 0.08);
        }
        .tab-btn[aria-selected="true"] {
            background: var(--ink);
            color: #ffffff;
            border-color: var(--ink);
        }
        .tab-panels {
            margin-top: 10px;
        }
        .tab-panel {
            display: none;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 24px;
            box-shadow: var(--shadow);
            overflow: hidden;
        }
        .tab-panel.is-active {
            display: block;
            animation: fadeIn 160ms ease-out;
        }
        .panel-head {
            padding: 18px 20px 12px;
            border-bottom: 1px solid var(--border);
            background: linear-gradient(180deg, rgba(248, 251, 255, 0.96), #ffffff);
        }
        .panel-title {
            margin: 0 0 6px;
            font-size: 1.08rem;
        }
        .panel-desc {
            margin: 0;
            color: var(--muted);
            line-height: 1.45;
        }
        .panel-body {
            padding: 18px 20px 20px;
        }
        .panel-note {
            border: 1px solid var(--border);
            background: linear-gradient(180deg, #ffffff, var(--card-soft));
            border-radius: 18px;
            padding: 14px 16px;
            color: var(--muted);
            line-height: 1.5;
            margin-bottom: 14px;
        }
        .chip-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }
        .chip {
            display: inline-flex;
            align-items: center;
            border-radius: 999px;
            padding: 6px 10px;
            background: rgba(106, 13, 173, 0.08);
            color: var(--accent);
            font-size: 0.82rem;
            font-weight: 600;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 14px;
        }
        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 14px;
        }
        .grid-hero {
            display: grid;
            grid-template-columns: 1.15fr 0.85fr;
            gap: 14px;
        }
        .card,
        .metric-card,
        .closing-card {
            border: 1px solid var(--border);
            border-radius: 18px;
            background: linear-gradient(180deg, #ffffff, var(--card-soft));
            overflow: hidden;
        }
        /* Visualizações (iframes) sem caixa - só o título (quando distingue algo real, ex.
           "Heatmap de população" vs "Índice de subserviço") e o próprio iframe, sem borda/fundo
           a separá-los visualmente do resto da página. */
        .frame-card {
            overflow: hidden;
        }
        .card-head {
            padding: 12px 14px;
            border-bottom: 1px solid var(--border);
            background: #fbf8ff;
        }
        .frame-head {
            padding: 0 0 8px;
        }
        .card-head h3,
        .frame-head h3,
        .metric-card h3 {
            margin: 0;
            font-size: 0.95rem;
        }
        .card-body,
        .metric-body {
            padding: 14px;
        }
        .lead-text {
            font-size: 1.03rem;
            line-height: 1.55;
            color: var(--ink);
            margin: 0 0 14px;
        }
        .bullet-list {
            margin: 0;
            padding-left: 18px;
            color: var(--muted);
            line-height: 1.55;
        }
        .bullet-list li + li {
            margin-top: 8px;
        }
        .steps {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 14px;
        }
        .step {
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px 12px;
            background: #ffffff;
            color: var(--ink);
            font-weight: 600;
        }
        .frame-shell {
            padding: 0;
        }
        .frame-shell iframe {
            width: 100%;
            height: 500px;
            border: 0;
            display: block;
            background: #ffffff;
        }
        .frame-shell.tall iframe {
            height: 560px;
        }
        .frame-shell.slim iframe {
            height: 420px;
        }
        .metric-card .frame-shell iframe {
            height: 440px;
        }
        .comparison-col {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        /* Cabeçalho de coluna (Portagem/Portela) sem caixa - só o essencial (qual coluna é
           qual), sem borda/fundo a competir com a visualização logo a seguir. */
        .comparison-heading {
            margin: 0;
        }
        .comparison-heading h3 {
            margin: 0 0 2px;
            font-size: 0.98rem;
            color: var(--ink);
        }
        .comparison-heading p {
            margin: 0;
            color: var(--muted);
            font-size: 0.9rem;
        }
        /* Legenda por baixo de uma visualização - texto simples, sem caixa/borda. */
        .frame-caption {
            margin: 8px 0 0;
            color: var(--muted);
            font-size: 0.86rem;
            line-height: 1.45;
        }
        .target-card {
            border: 1px dashed var(--border);
            border-radius: 18px;
            background: #fcfbff;
            padding: 14px 16px;
            color: var(--muted);
            line-height: 1.5;
        }
        .target-card h4 {
            margin: 0 0 8px;
            color: var(--ink);
            font-size: 0.95rem;
        }
        .target-card ul {
            margin: 0;
            padding-left: 18px;
        }
        .target-card li + li {
            margin-top: 6px;
        }
        .stats-wrap {
            margin-top: 14px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }
        .stats-card {
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            background: #ffffff;
        }
        .stats-card h4 {
            margin: 0;
            padding: 10px 12px;
            font-size: 0.92rem;
            border-bottom: 1px solid var(--border);
            background: #fbf8ff;
        }
        .stats-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.84rem;
        }
        .stats-table th,
        .stats-table td {
            text-align: center;
            padding: 7px 8px;
            border-bottom: 1px solid var(--border);
        }
        .stats-table th {
            color: var(--muted);
            background: #fcfbff;
            font-weight: 600;
        }
        .closing-layout {
            display: grid;
            grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr);
            gap: 14px;
        }
        .closing-hero {
            border-radius: 20px;
            background: linear-gradient(135deg, rgba(106, 13, 173, 0.98), rgba(15, 91, 156, 0.96));
            color: #ffffff;
            padding: 22px 20px;
            box-shadow: var(--shadow);
        }
        .closing-hero h2 {
            margin: 0;
            font-size: clamp(1.35rem, 2.2vw, 2rem);
            line-height: 1.15;
        }
        .closing-hero p {
            margin: 10px 0 0;
            color: rgba(255, 255, 255, 0.90);
            line-height: 1.55;
            max-width: 780px;
        }
        .closing-card {
            padding: 14px 16px;
        }
        .thanks-layout {
            min-height: 60vh;
            display: grid;
            place-items: center;
        }
        .thanks-card {
            width: min(920px, 100%);
            border-radius: 24px;
            background: linear-gradient(135deg, rgba(18, 28, 42, 0.98), rgba(35, 51, 74, 0.98));
            color: #ffffff;
            padding: 34px 28px;
            box-shadow: var(--shadow);
            text-align: center;
        }
        .thanks-card h2 {
            margin: 0;
            font-size: clamp(1.8rem, 4vw, 3rem);
        }
        .thanks-card p {
            margin: 10px auto 0;
            max-width: 720px;
            color: rgba(255, 255, 255, 0.88);
            line-height: 1.55;
        }
        .thanks-card .chip-row {
            justify-content: center;
            margin-top: 16px;
        }
        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @media (max-width: 1100px) {
            .grid-hero,
            .grid-2,
            .grid-3,
            .closing-layout {
                grid-template-columns: 1fr;
            }
            .frame-shell iframe,
            .frame-shell.tall iframe,
            .frame-shell.slim iframe,
            .metric-card .frame-shell iframe {
                height: 440px;
            }
            .thanks-card {
                padding: 24px 18px;
            }
        }
        @media (max-width: 760px) {
            .shell {
                padding: 14px 10px 28px;
            }
            .hero {
                border-radius: 18px;
                padding: 18px 16px;
            }
            .tab-btn {
                padding: 10px 14px;
            }
            .panel-head,
            .panel-body {
                padding-left: 14px;
                padding-right: 14px;
            }
            .frame-shell iframe,
            .frame-shell.tall iframe,
            .frame-shell.slim iframe,
            .metric-card .frame-shell iframe {
                height: 360px;
            }
            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

        <section class="hero">

        </section>

        <nav class="tabs" id="dashboard-tabs" aria-label="Tabs da apresentação"></nav>

        <section class="tab-panels" id="dashboard-panels"></section>
    </main>

        function esc(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function renderChips(items) {
            if (!Array.isArray(items) || !items.length) return '';
            return `<div class="chip-row">${items.map((item) => `<span class="chip">${esc(item)}</span>`).join('')}</div>`;
        }

        function renderIframeFrame(item, extraClass = '', options = {}) {
            const title = esc(item.title || item.label || 'Visualização');
            const src = esc(item.src || '');
            const bare = !!options.bare;
            const head = bare ? '' : `<div class="frame-head"><h3>${title}</h3></div>`;
            const caption = item.caption ? `<p class="frame-caption">${esc(item.caption)}</p>` : '';
            return `
                <article class="frame-card ${extraClass}">
                    ${head}
                    <div class="frame-shell ${extraClass}"><iframe title="${title}" loading="lazy" data-src="${src}" referrerpolicy="no-referrer"></iframe></div>
                    ${caption}
                </article>
            `;
        }

        function renderOverlapTable(rows) {
            const safeRows = Array.isArray(rows) ? rows : [];
            const body = safeRows.map((row) => `
                <tr>
                    <td>${esc(row.line || '-')}</td>
                    <td>${esc(row.overlap_pct || '-')}</td>
                    <td>${esc(row.overlap_m || '-')}</td>
                    <td>${esc(row.extension_m || '-')}</td>
                    <td>${esc(row.overlap_stops || '-')} / ${esc(row.total_stops || '-')}</td>
                    <td>${esc(row.avg_freq_min || '-')}</td>
                </tr>
            `).join('');

            return `
                <table class="stats-table">
                    <thead>
                        <tr>
                            <th>Linha</th>
                            <th>Overlap (%)</th>
                            <th>Overlap (m)</th>
                            <th>Extensão (m)</th>
                            <th>Paragens</th>
                            <th>Freq. média</th>
                        </tr>
                    </thead>
                    <tbody>${body}</tbody>
                </table>
            `;
        }

        function renderOverlapStats(item) {
            const stats = item && item.stats;
            if (!stats || (!Array.isArray(stats.top5) && !Array.isArray(stats.bottom5) && !Array.isArray(stats.bottom5_stadium))) {
                return '';
            }

            const temporal = stats.temporal_summary || {};
            const summary = temporal.total_spatial_candidates ? `
                <div class="panel-note" style="margin-top:14px;">
                    <strong>Resumo temporal:</strong> ${esc(temporal.temporal_overlap_pct || 0)}% das combinações espaciais passaram também o limiar temporal definido.

        function setActiveTab(tabId, focusButton = false) {
            const buttons = tabsEl.querySelectorAll('[data-tab-id]');
            const panels = panelsEl.querySelectorAll('[data-panel-id]');

            buttons.forEach((button) => {
                const active = button.dataset.tabId === tabId;
                button.setAttribute('aria-selected', active ? 'true' : 'false');
                button.tabIndex = active ? 0 : -1;
                if (active && focusButton) button.focus();
            });

            panels.forEach((panel) => {
                const active = panel.dataset.panelId === tabId;
                panel.classList.toggle('is-active', active);
                panel.hidden = !active;
                if (active) {
                    panel.querySelectorAll('iframe[data-src]').forEach((iframe) => {
                        if (!iframe.dataset.loaded) {
                            iframe.src = iframe.dataset.src;
                            iframe.dataset.loaded = '1';
                        }
                    });
                }
            });
        }

        function renderTabs() {
            tabsEl.innerHTML = tabs.map((item, index) => `
                <button
                    class="tab-btn"
                    type="button"
                    role="tab"
                    id="tab-${esc(item.id)}"
                    data-tab-id="${esc(item.id)}"
                    aria-controls="panel-${esc(item.id)}"
                    aria-selected="${index === 0 ? 'true' : 'false'}"
                    tabindex="${index === 0 ? '0' : '-1'}"
                >
                    ${esc(item.label)}
                </button>
            `).join('');

            panelsEl.innerHTML = tabs.map((item, index) => {
                const html = renderPanel(item);
                if (index === 0) return html;
                return html.replace('tab-panel is-active', 'tab-panel').replace(' hidden', ' hidden');
            }).join('');

            tabsEl.querySelectorAll('[data-tab-id]').forEach((button) => {
                button.addEventListener('click', () => setActiveTab(button.dataset.tabId, false));
                button.addEventListener('keydown', (event) => {
                    const key = event.key;
                    if (key !== 'ArrowLeft' && key !== 'ArrowRight' && key !== 'Home' && key !== 'End') return;

                    const currentIndex = tabs.findIndex((item) => item.id === button.dataset.tabId);
                    if (currentIndex < 0) return;

                    let nextIndex = currentIndex;
                    if (key === 'ArrowLeft') nextIndex = (currentIndex - 1 + tabs.length) % tabs.length;
                    if (key === 'ArrowRight') nextIndex = (currentIndex + 1) % tabs.length;
                    if (key === 'Home') nextIndex = 0;
                    if (key === 'End') nextIndex = tabs.length - 1;

                    event.preventDefault();
                    setActiveTab(tabs[nextIndex].id, true);
                });
            });

            setActiveTab(tabs[0].id, false);
        }

        renderTabs();
