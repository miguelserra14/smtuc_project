<!DOCTYPE html>
<!-- Esqueleto do build FeedNPlay (parede 9720x1920px). Layout full-bleed só o suficiente para
     correr no canvas certo - grid de bezels, tipografia à distância e position-bus da câmara
     ainda não implementados aqui, ver plano em curso. Motor de tabs/navegação por teclado
     copiado tal e qual de presentation_dashboard.html (não duplicar lógica, só o CSS mudou). -->
<html lang="pt">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light only" />
    <title>SMTUC: FeedNPlay</title>
    <style>
        :root {
            --bg: #f7f4ff;
            --bg-2: #f2edf9;
            --card: #ffffff;
            --card-soft: #fcfaff;
            --ink: #16202c;
            --muted: #5d6878;
            --border: #e7dff2;
            --accent: #6a0dad;
            --accent-2: #2d8f85;
            --accent-3: #0f5b9c;
            --shadow: 0 18px 50px rgba(106, 13, 173, 0.10);
            color-scheme: light only;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background:
                radial-gradient(circle at top left, rgba(15, 91, 156, 0.12), transparent 30%),
                radial-gradient(circle at top right, rgba(45, 143, 133, 0.10), transparent 26%),
                linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
            color: var(--ink);
            font-family: Segoe UI, Tahoma, sans-serif;
        }
        .shell {
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            overflow: hidden;
        }
        /* Sem título/tabs visíveis - navegação passa a ser por dwell (ver .fnp-dwell-*) ou,
           como reserva do apresentador, pelas setas do teclado nos botões de tab (mantidos no
           DOM via .visually-hidden, não display:none, para continuarem focáveis). */
        .hero {
            display: none;
        }
        .hero::after {
            content: "";
            position: absolute;
            right: -120px;
            bottom: -120px;
            width: 280px;
            height: 280px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.10);
            filter: blur(2px);
        }
        .eyebrow {
            display: inline-flex;
            gap: 8px;
            align-items: center;
            padding: 6px 10px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.14);
            font-size: 0.82rem;
            letter-spacing: 0.02em;
            margin-bottom: 10px;
        }
        h1 {
            margin: 0;
            font-size: clamp(1.6rem, 2.8vw, 2.55rem);
            line-height: 1.08;
            position: relative;
            z-index: 1;
        }
        .hero p {
            margin: 10px auto 0;
            max-width: 980px;
            line-height: 1.5;
            color: rgba(255, 255, 255, 0.90);
            position: relative;
            z-index: 1;
        }
        .tabs {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 18px 0 14px;
        }
        .tab-btn {
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.82);
            color: var(--ink);
            border-radius: 999px;
            padding: 11px 16px;
            font: inherit;
            cursor: pointer;
            transition: transform 140ms ease, box-shadow 140ms ease, background 140ms ease, color 140ms ease;
        }
        .tab-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(19, 33, 57, 0.08);
        }
        .tab-btn[aria-selected="true"] {
            background: var(--ink);
            color: #ffffff;
            border-color: var(--ink);
        }
        .tab-panels {
            position: fixed;
            inset: 0;
        }
        .tab-panel {
            display: none;
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            background: var(--card);
            overflow-y: auto;
            overflow-x: hidden;
        }
        .tab-panel.is-active {
            display: block;
            animation: fadeIn 160ms ease-out;
        }
        .panel-head {
            padding: 60px 40px 16px;
            border-bottom: 1px solid var(--border);
            background: linear-gradient(180deg, rgba(248, 251, 255, 0.96), #ffffff);
        }
        .panel-title {
            margin: 0 0 6px;
            font-size: 1.08rem;
        }
        .panel-desc {
            margin: 0;
            color: var(--muted);
            line-height: 1.45;
        }
        .panel-body {
            padding: 24px 40px 32px;
        }
        .panel-note {
            border: 1px solid var(--border);
            background: linear-gradient(180deg, #ffffff, var(--card-soft));
            border-radius: 18px;
            padding: 14px 16px;
            color: var(--muted);
            line-height: 1.5;
            margin-bottom: 14px;
        }
        .chip-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }
        .chip {
            display: inline-flex;
            align-items: center;
            border-radius: 999px;
            padding: 6px 10px;
            background: rgba(106, 13, 173, 0.08);
            color: var(--accent);
            font-size: 0.82rem;
            font-weight: 600;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 14px;
        }
        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 14px;
        }
        .grid-hero {
            display: grid;
            grid-template-columns: 1.15fr 0.85fr;
            gap: 14px;
        }
        .card,
        .metric-card,
        .closing-card {
            border: 1px solid var(--border);
            border-radius: 18px;
            background: linear-gradient(180deg, #ffffff, var(--card-soft));
            overflow: hidden;
        }
        /* Visualizações (iframes) sem caixa - só o título (quando distingue algo real, ex.
           "Heatmap de população" vs "Índice de subserviço") e o próprio iframe, sem borda/fundo
           a separá-los visualmente do resto da página. */
        .frame-card {
            overflow: hidden;
        }
        .card-head {
            padding: 12px 14px;
            border-bottom: 1px solid var(--border);
            background: #fbf8ff;
        }
        .frame-head {
            padding: 0 0 8px;
        }
        .card-head h3,
        .frame-head h3,
        .metric-card h3 {
            margin: 0;
            font-size: 0.95rem;
        }
        .card-body,
        .metric-body {
            padding: 14px;
        }
        .lead-text {
            font-size: 1.03rem;
            line-height: 1.55;
            color: var(--ink);
            margin: 0 0 14px;
        }
        .bullet-list {
            margin: 0;
            padding-left: 18px;
            color: var(--muted);
            line-height: 1.55;
        }
        .bullet-list li + li {
            margin-top: 8px;
        }
        .steps {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 14px;
        }
        .step {
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px 12px;
            background: #ffffff;
            color: var(--ink);
            font-weight: 600;
        }
        .frame-shell {
            padding: 0;
        }
        .frame-shell iframe {
            width: 100%;
            height: 500px;
            border: 0;
            display: block;
            background: #ffffff;
        }
        .frame-shell.tall iframe {
            height: 560px;
        }
        .frame-shell.slim iframe {
            height: 420px;
        }
        .metric-card .frame-shell iframe {
            height: 440px;
        }
        .comparison-col {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        /* Cabeçalho de coluna (Portagem/Portela) sem caixa - só o essencial (qual coluna é
           qual), sem borda/fundo a competir com a visualização logo a seguir. */
        .comparison-heading {
            margin: 0;
        }
        .comparison-heading h3 {
            margin: 0 0 2px;
            font-size: 0.98rem;
            color: var(--ink);
        }
        .comparison-heading p {
            margin: 0;
            color: var(--muted);
            font-size: 0.9rem;
        }
        /* Legenda por baixo de uma visualização - texto simples, sem caixa/borda. */
        .frame-caption {
            margin: 8px 0 0;
            color: var(--muted);
            font-size: 0.86rem;
            line-height: 1.45;
        }
        .target-card {
            border: 1px dashed var(--border);
            border-radius: 18px;
            background: #fcfbff;
            padding: 14px 16px;
            color: var(--muted);
            line-height: 1.5;
        }
        .target-card h4 {
            margin: 0 0 8px;
            color: var(--ink);
            font-size: 0.95rem;
        }
        .target-card ul {
            margin: 0;
            padding-left: 18px;
        }
        .target-card li + li {
            margin-top: 6px;
        }
        .stats-wrap {
            margin-top: 14px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }
        .stats-card {
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            background: #ffffff;
        }
        .stats-card h4 {
            margin: 0;
            padding: 10px 12px;
            font-size: 0.92rem;
            border-bottom: 1px solid var(--border);
            background: #fbf8ff;
        }
        .stats-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.84rem;
        }
        .stats-table th,
        .stats-table td {
            text-align: center;
            padding: 7px 8px;
            border-bottom: 1px solid var(--border);
        }
        .stats-table th {
            color: var(--muted);
            background: #fcfbff;
            font-weight: 600;
        }
        .closing-layout {
            display: grid;
            grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr);
            gap: 14px;
        }
        .closing-hero {
            border-radius: 20px;
            background: linear-gradient(135deg, rgba(106, 13, 173, 0.98), rgba(15, 91, 156, 0.96));
            color: #ffffff;
            padding: 22px 20px;
            box-shadow: var(--shadow);
        }
        .closing-hero h2 {
            margin: 0;
            font-size: clamp(1.35rem, 2.2vw, 2rem);
            line-height: 1.15;
        }
        .closing-hero p {
            margin: 10px 0 0;
            color: rgba(255, 255, 255, 0.90);
            line-height: 1.55;
            max-width: 780px;
        }
        .closing-card {
            padding: 14px 16px;
        }
        .thanks-layout {
            min-height: 60vh;
            display: grid;
            place-items: center;
        }
        .thanks-card {
            width: min(920px, 100%);
            border-radius: 24px;
            background: linear-gradient(135deg, rgba(18, 28, 42, 0.98), rgba(35, 51, 74, 0.98));
            color: #ffffff;
            padding: 34px 28px;
            box-shadow: var(--shadow);
            text-align: center;
        }
        .thanks-card h2 {
            margin: 0;
            font-size: clamp(1.8rem, 4vw, 3rem);
        }
        .thanks-card p {
            margin: 10px auto 0;
            max-width: 720px;
            color: rgba(255, 255, 255, 0.88);
            line-height: 1.55;
        }
        .thanks-card .chip-row {
            justify-content: center;
            margin-top: 16px;
        }
        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* Navegação por dwell (permanecer) em vez de tabs clicáveis - ver a função
           _fnpHandlePosition mais abaixo, no bloco de script. Estilo provisório (cores/tamanhos
           por afinar no passe de tipografia à distância); o essencial aqui é o preenchimento
           (.fnp-dwell-fill) refletir o progresso do dwell em tempo real. */
        .fnp-dwell-bar {
            position: fixed;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
            z-index: 9998;
            pointer-events: none;
        }
        .fnp-dwell-zone {
            position: relative;
            width: 52px;
            height: 44px;
            border-radius: 999px;
            background: rgba(22, 32, 44, 0.35);
            overflow: hidden;
            transition: opacity 160ms ease;
        }
        /* Primeiro/último slide: a zona correspondente não leva a lado nenhum (sem wrap-around -
           ver goToRelativeSlide) - fica visualmente apagada e para de acumular dwell, em vez de
           continuar a encher e nunca disparar (ver _fnpZoneAvailable). */
        .fnp-dwell-zone.is-disabled {
            opacity: 0.25;
        }
        .fnp-dwell-fill {
            position: absolute;
            inset: 0;
            width: 0%;
            background: rgba(106, 13, 173, 0.65);
            transition: width 60ms linear;
        }
        .fnp-dwell-label {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #ffffff;
            font-size: 1.15rem;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <main class="shell">
        <section class="hero">
            <div class="eyebrow">FeedNPlay - esqueleto</div>
            <h1>SMTUC: A caminho da complementaridade</h1>
            <p>Build de teste para a parede FeedNPlay (9720x1920px). Conteúdo por agora igual ao dos mockups da apresentação - grid de bezels, tipografia à distância e reação à câmara de topo ainda por implementar.</p>
        </section>

        <!-- Fica no DOM (não display:none) para o apresentador continuar a poder navegar pelas
             setas do teclado, mas some visualmente - a navegação normal é por dwell, ver abaixo. -->
        <nav class="tabs visually-hidden" id="dashboard-tabs" aria-label="Tabs da apresentação"></nav>

        <section class="tab-panels" id="dashboard-panels"></section>
    </main>

    <!-- Navegação por dwell: permanecer numa das duas zonas (~1.5s) avança/recua um slide - ver
         a função _fnpHandlePosition no bloco de script. -->
    <div class="fnp-dwell-bar">
        <div id="fnp-dwell-back" class="fnp-dwell-zone" aria-label="Anterior">
            <div class="fnp-dwell-fill"></div>
            <span class="fnp-dwell-label" aria-hidden="true">◀</span>
        </div>
        <div id="fnp-dwell-fwd" class="fnp-dwell-zone" aria-label="Seguinte">
            <div class="fnp-dwell-fill"></div>
            <span class="fnp-dwell-label" aria-hidden="true">▶</span>
        </div>
    </div>

                                    <p>O foco da apresentação é mostrar que já existe impacto mensurável e que o SMTUC pode responder com rapidez, antes de a narrativa pública da mobilidade em Coimbra ficar fechada sem esta adaptação.</p>
                                </div>
                                <div class="comparison-col">
                                    ${(item.points || []).map((point) => `
                                        <div class="closing-card">
                                            <p class="lead-text" style="margin:0;">${esc(point)}</p>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        </div>
                    </article>
                `;
            }

            if (kind === 'thanks') {
                return `
                    <article class="tab-panel" id="panel-${esc(item.id)}" data-panel-id="${esc(item.id)}" role="tabpanel" aria-labelledby="tab-${esc(item.id)}" hidden>
                        <div class="panel-head">
                            <h2 class="panel-title">${esc(item.label)}</h2>
                            <p class="panel-desc">${esc(item.description || '')}</p>
                        </div>
                        <div class="panel-body thanks-layout">
                            <div class="thanks-card">
                                <h2>${esc(item.title || 'Obrigado')}</h2>
                                <p>${esc(item.subtitle || '')}</p>
                                ${renderChips(item.contacts || [])}
                            </div>
                        </div>
                    </article>
                `;
            }

            return '';
        }

        function setActiveTab(tabId, focusButton = false) {
            const buttons = tabsEl.querySelectorAll('[data-tab-id]');
            const panels = panelsEl.querySelectorAll('[data-panel-id]');

            buttons.forEach((button) => {
                const active = button.dataset.tabId === tabId;
                button.setAttribute('aria-selected', active ? 'true' : 'false');
                button.tabIndex = active ? 0 : -1;
                if (active && focusButton) button.focus();
            });

            panels.forEach((panel) => {
                const active = panel.dataset.panelId === tabId;
                panel.classList.toggle('is-active', active);
                panel.hidden = !active;
                if (active) {
                    panel.querySelectorAll('iframe[data-src]').forEach((iframe) => {
                        if (!iframe.dataset.loaded) {
                            iframe.src = iframe.dataset.src;
                            iframe.dataset.loaded = '1';
                        }
                    });
                }
            });

            _fnpRefreshDwellAvailability();
            _fnpRefreshActiveIframes();
        }

        function renderTabs() {
            tabsEl.innerHTML = tabs.map((item, index) => `
                <button
                    class="tab-btn"
                    type="button"
                    role="tab"
                    id="tab-${esc(item.id)}"
                    data-tab-id="${esc(item.id)}"
                    aria-controls="panel-${esc(item.id)}"
                    aria-selected="${index === 0 ? 'true' : 'false'}"
                    tabindex="${index === 0 ? '0' : '-1'}"
                >
                    ${esc(item.label)}
                </button>
            `).join('');

            panelsEl.innerHTML = tabs.map((item, index) => {
                const html = renderPanel(item);
                if (index === 0) return html;
                return html.replace('tab-panel is-active', 'tab-panel').replace(' hidden', ' hidden');
            }).join('');

            tabsEl.querySelectorAll('[data-tab-id]').forEach((button) => {
                button.addEventListener('click', () => setActiveTab(button.dataset.tabId, false));
                button.addEventListener('keydown', (event) => {
                    const key = event.key;
                    if (key !== 'ArrowLeft' && key !== 'ArrowRight' && key !== 'Home' && key !== 'End') return;

                    const currentIndex = tabs.findIndex((item) => item.id === button.dataset.tabId);
                    if (currentIndex < 0) return;

                    let nextIndex = currentIndex;
                    if (key === 'ArrowLeft') nextIndex = (currentIndex - 1 + tabs.length) % tabs.length;
                    if (key === 'ArrowRight') nextIndex = (currentIndex + 1) % tabs.length;
                    if (key === 'Home') nextIndex = 0;
                    if (key === 'End') nextIndex = tabs.length - 1;

                    event.preventDefault();
                    setActiveTab(tabs[nextIndex].id, true);
                });
            });

            setActiveTab(tabs[0].id, false);
        }

        renderTabs();
    </script>
</body>
</html>
