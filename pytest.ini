[pytest]
# Torna "src/" importável a partir de qualquer teste (ex. `from overlap.transit import ...`)
# sem precisar de PYTHONPATH manual nem de um conftest.py - mecanismo nativo do pytest
# (>=7.0), substitui o antigo testing/pytest_conftest.py que nunca chegou a ser carregado
# (o pytest só reconhece automaticamente ficheiros chamados literalmente "conftest.py").
pythonpath = src
markers =
    integration: testes de integração com GTFS real (read-only)