[pytest]
# Torna "src/" importável a partir de qualquer teste (ex. `from overlap.transit import ...`)
# sem PYTHONPATH manual - mecanismo nativo do pytest (>=7.0). Os scripts de scripts/ são
# carregados por caminho (tests/script_loader.py) e põem eles próprios src/ no sys.path.
pythonpath = src
markers =
    integration: testes de integração com GTFS real (read-only)