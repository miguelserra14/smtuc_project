# Testes em cada push para main e em cada pull request.
#
# Windows + requirements-lock.txt: o mesmo sistema e as mesmas versões do ambiente de
# desenvolvimento (o lock inclui dependências só de Windows do pywebview).
# Corre a suite inteira: num clone faltam os .txt do SMTUC Ep225 (fora do git) e os testes que
# dependem deles saltam; os restantes usam os feeds e o BGRI versionados.
name: testes

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Instalar dependências (versões exatas)
        run: python -m pip install -r requirements-lock.txt
      - name: pytest
        run: python -m pytest -q -rs
