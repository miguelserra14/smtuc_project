<!DOCTYPE html>
<!-- Build FeedNPlay (parede 9720x1920px, 6.12x1.21m). Full-bleed, navegação por dwell,
     tipografia à distância (--fnp-base-font-px, ver :root) e guia de bezels (?bezels=1, ver
     .fnp-bezel-guide) - todos com valores de partida por afinar no local (ver comentários
     junto de cada um). FEEDNPLAY_PREVIEW_MODE (src/config.py) troca a tipografia à distância por
     tamanho de secretária, para ver isto num PC normal em vez da escala da parede. Motor de tabs/
     navegação por teclado copiado tal e qual de presentation_dashboard.html (não duplicar lógica,
     só o CSS mudou). Paleta/tipografia inspiradas em cm-coimbra.pt/comovou (comunicação oficial
     da Câmara sobre esta mesma fase 2 do Metrobus) - mesmos tokens de cor/fonte usados em
     presentation_dashboard.html, só traduzidos para a escala rem/px desta parede. -->
<html lang="pt">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>__TITLE__</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Tokens pensados para o CANVAS escuro (a página em si) - --ink/--muted/--border
               ficam claros aqui de propósito. Dentro de qualquer cartão claro (.card,
               .frame-card, .panel-note, etc.) estes 3 são redefinidos localmente mais abaixo
               para as versões escuras-sobre-branco - o resto do CSS (e o JS que gera os
               painéis) usa sempre os MESMOS var(--ink)/var(--muted)/var(--border) sem saber em
               que fundo está; é essa redefinição por âmbito que resolve os dois contrastes. */
            --page-bg: #16130f;
            --page-bg-2: #1d1811;
            --ink: #f5f3ee;
            --muted: rgba(245, 243, 238, 0.68);
            --border: rgba(245, 243, 238, 0.16);
            --card: #ffffff;
            --card-soft: #faf8f4;
            --accent: #ffdd2b;
            --accent-ink: #221d13;
            --accent-2: #ffb500;
            --shadow: 0 22px 48px rgba(0, 0, 0, 0.38);
            --font-head: 'Space Mono', 'Courier New', monospace;
            --font-body: 'Inter Tight', 'Segoe UI', Tahoma, sans-serif;
            /* Tipografia à distância: a parede (9720x1920px em 6.12x1.21m) tem uma densidade de
               ~0.63mm/px, bem menor que um ecrã de secretária (~0.26mm/px) - o mesmo tamanho em
               rem já sai maior fisicamente na parede, mas não o suficiente para ser lido
               confortavelmente a alguns metros. Como (quase) todo o texto neste template já usa
               rem/clamp(rem,vw,rem), aumentar só esta ÚNICA variável escala tudo
               proporcionalmente (títulos, corpo, chips, dwell bar) sem mexer em cada regra.
               56px = 3.5x o valor por omissão do browser (16px) - é uma ESTIMATIVA de partida,
               não uma medição real; a primeira coisa a calibrar no local é este número, até o
               texto ficar confortável à distância real a que o público se costuma posicionar. */
            --fnp-base-font-px: 56px;
            color-scheme: dark;
        }
        /* Redefine os 3 tokens de texto/fronteira para as suas versões "sobre branco" dentro de
           qualquer cartão claro - ver comentário em :root. */
        .card, .frame-card, .step {
            --ink: #221d13;
            --muted: #5c574c;
            --border: #e7e2d8;
        }
        /* Pré-visualização no PC - liga/desliga em FEEDNPLAY_PREVIEW_MODE (src/config.py), que
           troca --fnp-base-font-px pelo tamanho de secretária normal acima em vez do calibrado
           para a parede. No próprio <html> (:root), não no body - custom properties só afetam o
           elemento onde são (re)declaradas ou os seus descendentes, nunca o contrário, e o body é
           descendente do html. Ver toggle em JS mais abaixo (FNP_PREVIEW_MODE). */
        :root.fnp-preview-mode {
            --fnp-base-font-px: __FNP_PREVIEW_BASE_FONT_PX__;
        }
        html {
            font-size: var(--fnp-base-font-px);
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--page-bg);
            color: var(--ink);
            font-family: var(--font-body);
        }
        .shell {
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            overflow: hidden;
        }
        /* Sem título/tabs visíveis - navegação passa a ser por dwell (ver .fnp-dwell-*) ou,
           como reserva do apresentador, pelas setas do teclado nos botões de tab (mantidos no
           DOM via .visually-hidden, não display:none, para continuarem focáveis). */
        .eyebrow {
            display: inline-flex;
            gap: 0.5rem;
            align-items: center;
            padding: 0.375rem 0.625rem;
            border-radius: 999px;
            background: var(--accent);
            color: var(--accent-ink);
            font-family: var(--font-head);
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.78rem;
            letter-spacing: 0.05em;
            margin-bottom: 0.625rem;
        }
        .tabs {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 18px 0 14px;
        }
        .tab-btn {
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.06);
            color: var(--ink);
            font-family: var(--font-head);
            text-transform: uppercase;
            border-radius: 999px;
            padding: 11px 16px;
            font-size: inherit;
            cursor: pointer;
            transition: transform 140ms ease, background 140ms ease, color 140ms ease;
        }
        .tab-btn:hover {
            transform: translateY(-1px);
            background: rgba(255, 255, 255, 0.11);
            border-color: var(--accent);
        }
        .tab-btn[aria-selected="true"] {
            background: var(--accent);
            color: var(--accent-ink);
            border-color: var(--accent);
        }
        .tab-panels {
            position: fixed;
            inset: 0;
        }
        .tab-panel {
            display: none;
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            background: var(--page-bg);
            overflow-y: auto;
            overflow-x: hidden;
        }
        .tab-panel.is-active {
            display: block;
            animation: fadeIn 160ms ease-out;
        }
        .panel-head {
            padding: 3.75rem 2.5rem 1rem;
        }
        .panel-title {
            margin: 0 0 0.375rem;
            font-family: var(--font-head);
            font-weight: 700;
            text-transform: uppercase;
            font-size: 1.08rem;
            color: var(--ink);
            border-left: 0.3rem solid var(--accent-2);
            padding-left: 0.75rem;
        }
        .panel-desc {
            margin: 0 0 0 1rem;
            color: var(--muted);
            line-height: 1.45;
        }
        .panel-body {
            padding: 1.5rem 2.5rem 2rem;
        }
        /* Notas, "versão otimizada", tabelas e cabeçalho de coluna ficam ESCUROS (tom do
           canvas) - só .card/.frame-card continuam claros, porque o conteúdo lá dentro
           (gráfico/mapa) já é branco por si; o resto do texto acompanha o fundo escuro. */
        .panel-note {
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.05);
            border-radius: 18px;
            padding: 0.875rem 1rem;
            color: var(--muted);
            line-height: 1.5;
            margin-bottom: 0.875rem;
            box-shadow: var(--shadow);
        }
        .chip-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 0.75rem;
        }
        .chip {
            display: inline-flex;
            align-items: center;
            border-radius: 999px;
            padding: 0.3rem 0.625rem;
            background: rgba(255, 181, 0, 0.14);
            color: #8a5f00;
            font-family: var(--font-head);
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.72rem;
        }
        /* Dentro de cartões escuros (fecho/agradecimentos) os chips invertem para claro-sobre-
           escuro, em vez de herdar o par âmbar-sobre-branco pensado para cartões claros. */
        .closing-hero .chip-row .chip,
        .thanks-card .chip-row .chip {
            background: rgba(255, 255, 255, 0.14);
            color: #ffffff;
        }
        /* grid-template-columns escolhidas para a fronteira entre colunas cair exatamente numa
           junção de monitores (parede = 9 monitores de 1080px cada, em 9720px totais - qualquer
           fração N/9 cai numa junção; frações "redondas" como 1fr/1fr ou 1.15fr/0.85fr caem a
           meio de um monitor físico, cortando o conteúdo ao meio em vez de na moldura entre
           ecrãs). grid-3 (3 colunas iguais = 3240px cada = exatamente 3 monitores) já alinhava
           por acaso e não mudou. Isto é a MELHOR ESTIMATIVA sem ver a parede a sério - o
           alinhamento fino real (incluindo o padding de .panel-body) só se confirma no local,
           com a guia visual ?bezels=1 (ver mais abaixo, perto de .fnp-bezel-guide). */
        .grid-2 {
            display: grid;
            grid-template-columns: minmax(0, 4fr) minmax(0, 5fr);
            gap: 0.875rem;
        }
        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 0.875rem;
        }
        .grid-hero {
            display: grid;
            grid-template-columns: 5fr 4fr;
            gap: 0.875rem;
        }
        .card {
            border: 1px solid var(--border);
            border-radius: 18px;
            background: var(--card);
            overflow: hidden;
            box-shadow: var(--shadow);
        }
        /* Cartões que ficam ao lado de um cartão de abertura escuro (hero-card / closing-hero,
           ver kind==="hero"/"closing" no JS) ficam ESCUROS (tom do canvas), não brancos como os
           restantes cartões - texto curto lê-se bem sobre o fundo escuro e evita 3 blocos
           brancos a competir visualmente com o cartão principal ao lado. */
        .metric-card,
        .closing-card {
            border: 1px solid var(--border);
            border-left: 0.25rem solid var(--accent);
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.05);
            overflow: hidden;
            box-shadow: var(--shadow);
        }
        .metric-card .lead-text,
        .closing-card .lead-text {
            font-weight: 500;
        }
        /* Mesmo reforço tipográfico dado ao texto das duas caixas acima - texto a 400 (normal)
           fica com pouca presença sobre fundo escuro translúcido; 500 dá a estas caixas escuras
           (nota, versão otimizada, subtítulo de coluna) o mesmo registo visual. */
        .panel-note,
        .target-card,
        .comparison-heading p {
            font-weight: 500;
        }
        /* Slide "Introdução" - o cartão principal (título grande da apresentação) fica escuro
           de propósito, como abertura de maior impacto (ver kind==="hero" no JS), distinto dos
           restantes cartões (claros) que levam conteúdo/dados a seguir. */
        .hero-card {
            background: linear-gradient(165deg, var(--page-bg-2), #100d09);
            border-color: rgba(255, 255, 255, 0.10);
        }
        .hero-card, .hero-card .lead-text {
            --ink: #f5f3ee;
            --muted: rgba(245, 243, 238, 0.72);
            --border: rgba(245, 243, 238, 0.16);
        }
        /* Visualizações (iframes) apresentadas como cartão claro arredondado sobre o fundo
           escuro - o fundo branco do mapa/gráfico deixa de "cortar" contra o escuro e ganha a
           mesma moldura que o resto do conteúdo. */
        .frame-card {
            border: 1px solid var(--border);
            border-radius: 1rem;
            background: var(--card);
            box-shadow: var(--shadow);
            overflow: hidden;
        }
        .card-head {
            padding: 0.75rem 0.875rem;
            border-bottom: 1px solid var(--border);
            background: var(--card-soft);
        }
        .frame-head {
            padding: 0.75rem 0.875rem;
            border-bottom: 1px solid var(--border);
            background: var(--card-soft);
        }
        .card-head h3,
        .frame-head h3,
        .metric-card h3 {
            margin: 0;
            font-family: var(--font-head);
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.85rem;
            color: #8a5f00;
        }
        .card-body,
        .metric-body {
            padding: 0.875rem;
        }
        .lead-text {
            font-size: 1.03rem;
            line-height: 1.55;
            color: var(--ink);
            margin: 0 0 0.875rem;
        }
        .bullet-list {
            margin: 0;
            padding-left: 1.125rem;
            color: var(--muted);
            line-height: 1.55;
        }
        .bullet-list li + li {
            margin-top: 0.5rem;
        }
        .steps {
            display: flex;
            flex-wrap: wrap;
            gap: 0.625rem;
            margin-top: 0.875rem;
        }
        .step {
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 0.625rem 0.75rem;
            background: var(--card-soft);
            color: var(--ink);
            font-family: var(--font-head);
            font-weight: 700;
        }
        .frame-shell {
            padding: 0;
        }
        .frame-shell iframe {
            width: 100%;
            height: 31.25rem;
            border: 0;
            display: block;
            background: #ffffff;
        }
        .frame-shell.tall iframe {
            height: 35rem;
        }
        .frame-shell.slim iframe {
            height: 26.25rem;
        }
        .metric-card .frame-shell iframe {
            height: 27.5rem;
        }
        .comparison-col {
            display: flex;
            flex-direction: column;
            gap: 0.875rem;
        }
        /* Cabeçalho de coluna (Portagem/Portela) como cartão claro - antes ficava só texto
           solto sobre o fundo escuro, destoando do frame-card (com caixa) logo a seguir. */
        .comparison-heading {
            margin: 0;
            border: 1px solid var(--border);
            border-left: 0.25rem solid var(--accent);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.05);
            padding: 0.625rem 0.875rem;
            box-shadow: var(--shadow);
        }
        .comparison-heading h3 {
            margin: 0 0 0.125rem;
            font-family: var(--font-head);
            text-transform: uppercase;
            font-size: 0.98rem;
            color: var(--ink);
        }
        .comparison-heading p {
            margin: 0;
            color: var(--muted);
            font-size: 0.9rem;
        }
        .frame-caption {
            margin: 0;
            padding: 0.5rem 0.875rem 0.875rem;
            color: var(--muted);
            font-size: 0.86rem;
            line-height: 1.45;
            font-style: italic;
        }
        .target-card {
            border: 1px dashed var(--border);
            background: rgba(255, 255, 255, 0.05);
            border-radius: 18px;
            padding: 0.875rem 1rem;
            color: var(--muted);
            line-height: 1.5;
            box-shadow: var(--shadow);
        }
        .target-card h4 {
            margin: 0 0 0.5rem;
            color: var(--ink);
            font-family: var(--font-head);
            text-transform: uppercase;
            font-size: 0.95rem;
        }
        .target-card ul {
            margin: 0;
            padding-left: 1.125rem;
        }
        .target-card li + li {
            margin-top: 0.375rem;
        }
        .stats-wrap {
            margin-top: 0.875rem;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0.75rem;
        }
        .stats-card {
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.05);
            box-shadow: var(--shadow);
        }
        .stats-card h4 {
            margin: 0;
            padding: 0.625rem 0.75rem;
            font-family: var(--font-head);
            text-transform: uppercase;
            font-size: 0.85rem;
            border-bottom: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.06);
        }
        .stats-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.84rem;
        }
        .stats-table th,
        .stats-table td {
            text-align: center;
            padding: 0.4375rem 0.5rem;
            border-bottom: 1px solid var(--border);
            color: var(--ink);
        }
        .stats-table th {
            color: var(--muted);
            background: rgba(255, 255, 255, 0.06);
            font-weight: 600;
        }
        .closing-layout {
            display: grid;
            grid-template-columns: 5fr 4fr;
            gap: 0.875rem;
        }
        .closing-hero {
            border-radius: 20px;
            border-top: 0.3rem solid var(--accent);
            background: linear-gradient(165deg, var(--page-bg-2), #100d09);
            color: #ffffff;
            padding: 1.375rem 1.25rem;
            box-shadow: var(--shadow);
        }
        .closing-hero h2 {
            margin: 0;
            font-family: var(--font-head);
            text-transform: uppercase;
            font-weight: 700;
            font-size: clamp(1.35rem, 2.2vw, 2rem);
            line-height: 1.15;
        }
        .closing-hero p {
            margin: 0.625rem 0 0;
            color: rgba(255, 255, 255, 0.78);
            line-height: 1.55;
            max-width: 48.75rem;
        }
        .closing-card {
            padding: 0.875rem 1rem;
        }
        .thanks-layout {
            min-height: 60vh;
            display: grid;
            place-items: center;
        }
        .thanks-card {
            width: min(57.5rem, 100%);
            border-radius: 24px;
            border-top: 0.3rem solid var(--accent);
            background: linear-gradient(165deg, var(--page-bg-2), #0d0b08);
            color: #ffffff;
            padding: 2.125rem 1.75rem;
            box-shadow: var(--shadow);
            text-align: center;
        }
        .thanks-card h2 {
            margin: 0;
            font-family: var(--font-head);
            text-transform: uppercase;
            font-weight: 700;
            font-size: clamp(1.8rem, 4vw, 3rem);
        }
        .thanks-card p {
            margin: 0.625rem auto 0;
            max-width: 45rem;
            color: rgba(255, 255, 255, 0.78);
            line-height: 1.55;
        }
        .thanks-card .chip-row {
            justify-content: center;
            margin-top: 1rem;
        }
        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* Navegação por dwell (permanecer) em vez de tabs clicáveis - ver a função
           _fnpHandlePosition mais abaixo, no bloco de script. */
        .fnp-dwell-bar {
            position: fixed;
            top: 0.875rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 0.375rem;
            z-index: 9998;
            pointer-events: none;
        }
        .fnp-dwell-zone {
            position: relative;
            width: 3.25rem;
            height: 2.75rem;
            border-radius: 999px;
            background: rgba(245, 243, 238, 0.16);
            overflow: hidden;
            transition: opacity 160ms ease;
        }
        /* Clique/toque nas zonas é opt-in via FEEDNPLAY_CLICK_TO_ADVANCE (src/config.py) - o
           script injeta a classe fnp-click-to-advance no <body> quando ligado (ver
           __FNP_CLICK_TO_ADVANCE__ mais abaixo). Com a flag desligada, a barra-mãe
           (.fnp-dwell-bar) mantém pointer-events:none, herdado pelas zonas, que passam a
           responder só por dwell/mousemove, como antes desta opção existir. */
        body.fnp-click-to-advance .fnp-dwell-zone {
            pointer-events: auto;
            cursor: pointer;
        }
        /* Primeiro/último slide: a zona correspondente não leva a lado nenhum (sem wrap-around -
           ver goToRelativeSlide) - fica visualmente apagada e para de acumular dwell, em vez de
           continuar a encher e nunca disparar (ver _fnpZoneAvailable). Sem clique nem cursor de
           "clicável" também, pelo mesmo motivo. */
        .fnp-dwell-zone.is-disabled {
            opacity: 0.25;
        }
        body.fnp-click-to-advance .fnp-dwell-zone.is-disabled {
            pointer-events: none;
            cursor: default;
        }
        .fnp-dwell-fill {
            position: absolute;
            inset: 0;
            width: 0%;
            background: var(--accent);
            transition: width 60ms linear;
        }
        .fnp-dwell-label {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #ffffff;
            font-size: 1.15rem;
            font-weight: 700;
        }
        /* Guia visual das molduras entre os 9 monitores (só aparece com ?bezels=1 na URL - ver
           bloco de script). Ferramenta de calibração para quem estiver fisicamente na parede a
           decidir onde cada layout deve "respeitar" a moldura física - não é para o público
           ver, por isso fica escondida por omissão em vez de um botão/atalho visível. As linhas
           são posicionadas em percentagem (N/9), correta em qualquer largura de janela onde
           esta página seja aberta, não só nos 9720px reais da parede. */
        .fnp-bezel-guide {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 99996;
            pointer-events: none;
        }
        body.fnp-show-bezels .fnp-bezel-guide {
            display: block;
        }
        .fnp-bezel-line {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 2px;
            background: rgba(255, 0, 60, 0.55);
        }
        .fnp-bezel-line span {
            position: absolute;
            top: 0.5rem;
            left: 0.25rem;
            font-size: 0.7rem;
            font-family: 'Segoe UI', monospace;
            color: #ffffff;
            background: rgba(255, 0, 60, 0.75);
            padding: 0.125rem 0.25rem;
            border-radius: 0.25rem;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <main class="shell">
        <!-- Fica no DOM (não display:none) para o apresentador continuar a poder navegar pelas
             setas do teclado, mas some visualmente - a navegação normal é por dwell, ver abaixo. -->
        <nav class="tabs visually-hidden" id="dashboard-tabs" aria-label="Tabs da apresentação"></nav>

        <section class="tab-panels" id="dashboard-panels"></section>
    </main>

    <!-- Navegação por dwell: permanecer numa das duas zonas (~1.5s) avança/recua um slide - ver
         a função _fnpHandlePosition no bloco de script. -->
    <div class="fnp-dwell-bar">
        <div id="fnp-dwell-back" class="fnp-dwell-zone" aria-label="Anterior">
            <div class="fnp-dwell-fill"></div>
            <span class="fnp-dwell-label" aria-hidden="true">◀</span>
        </div>
        <div id="fnp-dwell-fwd" class="fnp-dwell-zone" aria-label="Seguinte">
            <div class="fnp-dwell-fill"></div>
            <span class="fnp-dwell-label" aria-hidden="true">▶</span>
        </div>
    </div>

    <!-- Overlay de debug do sinal da câmara - permite validar o pipeline sem estar no local do
         FeedNPlay (ver src/feednplay/bridge.py); manter até à calibração final no local, onde
         deixa de ser preciso. Tamanho fixo de propósito (é um utilitário de developer, não
         conteúdo para o público) - não interfere com clique/toque (pointer-events: none). -->
    <div id="fnp-debug" style="position:fixed;top:8px;right:8px;z-index:99999;background:rgba(0,0,0,0.72);color:#fff;font:12px/1.4 'Segoe UI',monospace;padding:8px 10px;border-radius:8px;pointer-events:none;">
        câmara: a aguardar sinal...
    </div>

    <!-- Guia visual das 8 molduras entre os 9 monitores - só visível com ?bezels=1 na URL (ver
         script). Populada por JS (não é prático escrever 8 divs à mão e manter em sincronia com
         o número de monitores). -->
    <div id="fnp-bezel-guide" class="fnp-bezel-guide"></div>

    <script>
        const tabs = __TABS_JSON__;
        const tabsEl = document.getElementById('dashboard-tabs');
        const panelsEl = document.getElementById('dashboard-panels');
        const fnpDebugEl = document.getElementById('fnp-debug');
        const fnpQueryParams = new URLSearchParams(window.location.search);

        // Liga/desliga em src/config.py (FEEDNPLAY_CLICK_TO_ADVANCE), injetado por
        // create_feednplay_dashboard_html - o dwell (permanecer ~1.5s) fica sempre ativo, isto só
        // acrescenta (ou não) poder clicar/tocar diretamente nas zonas para o mesmo efeito.
        const FNP_CLICK_TO_ADVANCE = __FNP_CLICK_TO_ADVANCE__;
        if (FNP_CLICK_TO_ADVANCE) {
            document.body.classList.add('fnp-click-to-advance');
        }

        // Liga/desliga em src/config.py (FEEDNPLAY_PREVIEW_MODE) - troca a tipografia à
        // distância pelo tamanho de secretária normal (ver `:root.fnp-preview-mode` no CSS).
        // Corre antes de renderTabs() (mais abaixo) para já aplicar o tamanho certo ao conteúdo
        // gerado, em vez de o utilizador ver primeiro a escala da parede e só depois encolher.
        const FNP_PREVIEW_MODE = __FNP_PREVIEW_MODE__;
        if (FNP_PREVIEW_MODE) {
            document.documentElement.classList.add('fnp-preview-mode');
        }

        // ---------------------------------------------------------------------------------
        // Guia visual das molduras entre os 9 monitores (?bezels=1 na URL) - ferramenta de
        // calibração para usar fisicamente na parede: mostra onde cada linha de moldura cai,
        // para ajustar paddings/fr-ratios das grids até o conteúdo relevante não ficar cortado
        // ao meio por uma moldura física. NUM_MONITORS/MONITOR_WIDTH_PX documentam a geometria
        // real (9720x1920px = 9 monitores de 1080px), mas as linhas são posicionadas em
        // percentagem, por isso funcionam corretamente nesta janela de testes OU nos 9720px
        // reais.
        // ---------------------------------------------------------------------------------
        const FNP_NUM_MONITORS = 9;
        if (fnpQueryParams.get('bezels') === '1') {
            document.body.classList.add('fnp-show-bezels');
            const guideEl = document.getElementById('fnp-bezel-guide');
            if (guideEl) {
                let linesHtml = '';
                for (let i = 1; i < FNP_NUM_MONITORS; i++) {
                    const pct = ((i / FNP_NUM_MONITORS) * 100).toFixed(3);
                    linesHtml += `<div class="fnp-bezel-line" style="left:${pct}%"><span>${i}/${FNP_NUM_MONITORS}</span></div>`;
                }
                guideEl.innerHTML = linesHtml;
            }
        }

        // ---------------------------------------------------------------------------------
        // Navegação por dwell: permanecer (não clicar) numa das duas zonas ao centro-topo do
        // ecrã avança/recua um slide. Zonas em fração de x (0-1) da área de interação da
        // câmara - por afinar depois de calibrar a câmara real no local, a área de interação
        // pode não corresponder exatamente à largura da parede.
        // ---------------------------------------------------------------------------------
        const FNP_ZONE_BACK = [0.38, 0.48];
        const FNP_ZONE_FWD = [0.52, 0.62];
        const FNP_DWELL_MS = 1500;
        // As zonas antes só filtravam por x - qualquer y dentro dessa faixa horizontal enchia a
        // barra, mesmo com o cursor bem abaixo do botão (ex.: a testar com o rato no meio do
        // ecrã). y=0-1 tem significados diferentes consoante a fonte: no fallback de rato é a
        // fração vertical da janela (0=topo, onde os botões estão); na câmara real é
        // perto/longe da parede - nos dois casos, um valor baixo significa "suficientemente
        // perto dos botões/da parede para ser intencional". Por afinar depois de calibrar a
        // câmara real no local.
        const FNP_ZONE_MAX_Y = 0.5;

        const fnpDwellState = {
            back: { start: null, triggered: false },
            fwd: { start: null, triggered: false },
        };
        const fnpDwellEls = {
            back: document.getElementById('fnp-dwell-back'),
            fwd: document.getElementById('fnp-dwell-fwd'),
        };
        // Referências às barras de preenchimento resolvidas uma única vez - antes eram
        // procuradas com querySelector a cada posição recebida (dezenas/s), o que somava
        // trabalho de DOM desnecessário a cada frame e contribuía para o lag a meio do
        // preenchimento reportado pelo utilizador.
        const fnpDwellFillEls = {
            back: fnpDwellEls.back ? fnpDwellEls.back.querySelector('.fnp-dwell-fill') : null,
            fwd: fnpDwellEls.fwd ? fnpDwellEls.fwd.querySelector('.fnp-dwell-fill') : null,
        };

        function _fnpCurrentIndex() {
            const currentButton = tabsEl.querySelector('[aria-selected="true"]');
            const currentId = currentButton ? currentButton.dataset.tabId : tabs[0].id;
            return Math.max(0, tabs.findIndex((item) => item.id === currentId));
        }

        // Sem wrap-around: no primeiro slide não há "Anterior", no último não há "Seguinte".
        function _fnpZoneAvailable(zoneKey) {
            const currentIndex = _fnpCurrentIndex();
            if (zoneKey === 'back') return currentIndex > 0;
            if (zoneKey === 'fwd') return currentIndex < tabs.length - 1;
            return true;
        }

        // Chamado sempre que o slide ativo muda (setActiveTab) - apaga visualmente e impede de
        // acumular dwell a zona que não leva a lado nenhum a partir do slide atual.
        function _fnpRefreshDwellAvailability() {
            if (fnpDwellEls.back) fnpDwellEls.back.classList.toggle('is-disabled', !_fnpZoneAvailable('back'));
            if (fnpDwellEls.fwd) fnpDwellEls.fwd.classList.toggle('is-disabled', !_fnpZoneAvailable('fwd'));
        }

        function goToRelativeSlide(delta) {
            const currentIndex = _fnpCurrentIndex();
            const nextIndex = currentIndex + delta;
            if (nextIndex < 0 || nextIndex >= tabs.length) return;
            setActiveTab(tabs[nextIndex].id, false);
        }

        // Clique/toque direto nas zonas de anterior/seguinte, como alternativa ao dwell (permanecer
        // ~1.5s) - útil para testar sem câmara e para quem prefira carregar em vez de esperar. Reusa
        // o mesmo goToRelativeSlide do dwell e do teclado, por isso mantém a mesma regra de "sem
        // wrap-around" (clique no primeiro/último slide não faz nada, ver _fnpZoneAvailable acima).
        // Só liga com FNP_CLICK_TO_ADVANCE (FEEDNPLAY_CLICK_TO_ADVANCE em config.py) - com a flag
        // desligada nem o listener é registado (a zona também não tem pointer-events, ver CSS).
        if (FNP_CLICK_TO_ADVANCE) {
            if (fnpDwellEls.back) fnpDwellEls.back.addEventListener('click', () => goToRelativeSlide(-1));
            if (fnpDwellEls.fwd) fnpDwellEls.fwd.addEventListener('click', () => goToRelativeSlide(1));
        }

        // Atualiza o progresso de UMA zona de dwell e devolve true no exato instante em que
        // completa (não em cada tick seguinte enquanto lá se continua) - dispara uma só vez por
        // permanência; é preciso sair da zona para poder disparar outra vez.
        function _fnpUpdateDwellZone(zoneKey, range, x, y, active, now) {
            const state = fnpDwellState[zoneKey];
            const fillEl = fnpDwellFillEls[zoneKey];
            const available = _fnpZoneAvailable(zoneKey);
            const nearEnough = y !== null && y <= FNP_ZONE_MAX_Y;
            const inZone = available && active && nearEnough && x !== null && x >= range[0] && x < range[1];

            if (!inZone) {
                state.start = null;
                state.triggered = false;
                if (fillEl) fillEl.style.width = '0%';
                return false;
            }

            if (state.start === null) {
                state.start = now;
            }

            const progress = state.triggered ? 1 : Math.min(1, (now - state.start) / FNP_DWELL_MS);
            if (fillEl) fillEl.style.width = `${(progress * 100).toFixed(1)}%`;

            if (progress >= 1 && !state.triggered) {
                state.triggered = true;
                return true;
            }
            return false;
        }

        // Iframes do slide ATUALMENTE visível apenas (não todos os já carregados) - resolvido
        // uma vez por troca de slide em setActiveTab, não a cada posição recebida. Antes o relay
        // ia para TODOS os iframes com data-loaded (todos os slides já visitados), o que fazia
        // slides como o "Overlap" recalcularem a isócrona invisível em cada tick de posição
        // mesmo estando escondidos - trabalho de fundo concorrente com a animação de
        // preenchimento das zonas de dwell, e a causa mais provável do lag reportado.
        let fnpActiveIframes = [];
        function _fnpRefreshActiveIframes() {
            const activePanel = panelsEl.querySelector('.tab-panel.is-active');
            fnpActiveIframes = activePanel ? Array.from(activePanel.querySelectorAll('iframe[data-loaded]')) : [];
        }

        // Ponte central de posição: chamada tanto pela câmara real (window.__fnpOnPresence,
        // via evaluate_js do bridge Python) como pelo mousemove nativo (fallback de
        // desenvolvimento sem Kafka, ver abaixo) - as duas fontes alimentam exatamente a mesma
        // lógica de dwell e o mesmo relay para o iframe atual.
        function _fnpHandlePosition(data) {
            window.__fnpLastPresence = data;
            const now = performance.now();
            const active = !!(data && data.active);
            const x = active ? Number(data.x) : null;
            const y = active ? Number(data.y) : null;

            if (fnpDebugEl) {
                fnpDebugEl.textContent = active
                    ? `câmara: x=${x.toFixed(2)} y=${y.toFixed(2)}${data.id ? ' id=' + data.id : ''}`
                    : 'câmara: sem presença (estado ambiente)';
            }

            const backTriggered = _fnpUpdateDwellZone('back', FNP_ZONE_BACK, x, y, active, now);
            const fwdTriggered = _fnpUpdateDwellZone('fwd', FNP_ZONE_FWD, x, y, active, now);
            if (backTriggered) goToRelativeSlide(-1);
            if (fwdTriggered) goToRelativeSlide(1);

            // Position-bus só para o(s) iframe(s) do slide visível (ver visualizations/
            // reachability.py) - evaluate_js só chega a este documento de topo, nunca
            // diretamente ao documento de um <iframe>, daí o postMessage.
            fnpActiveIframes.forEach((iframe) => {
                try {
                    iframe.contentWindow.postMessage({ __fnpPosition: data }, '*');
                } catch (e) {
                    // iframe de origem diferente ou ainda não pronto - ignora, tenta na próxima
                }
            });
        }

        // As duas fontes de posição (câmara real via evaluate_js, mousemove nativo) podem
        // disparar mais rápido do que o ecrã pinta (mousemove num browser normal chega a
        // 100-240Hz). Processar cada evento de imediato empilhava trabalho de DOM/postMessage
        // acima do que um frame consegue escoar, sentido como engasgo a meio do preenchimento
        // roxo. Em vez disso, só a posição mais recente de cada frame é processada, via
        // requestAnimationFrame - o essencial (fluidez visual) não perde nada, já que posições
        // intermédias dentro do mesmo frame nunca chegavam a ser pintadas de qualquer forma.
        let fnpPendingPosition = null;
        let fnpRafScheduled = false;
        function _fnpQueuePosition(data) {
            fnpPendingPosition = data;
            if (fnpRafScheduled) return;
            fnpRafScheduled = true;
            window.requestAnimationFrame(function () {
                fnpRafScheduled = false;
                const pending = fnpPendingPosition;
                fnpPendingPosition = null;
                if (pending) _fnpHandlePosition(pending);
            });
        }

        window.__fnpOnPresence = function (data) {
            _fnpQueuePosition(data);
        };

        // Fallback de desenvolvimento sem câmara/Kafka: o rato sobre a própria página gera o
        // mesmo formato de dados que o bridge Python enviaria, para testar o dwell num browser
        // normal (ver plano em curso).
        document.addEventListener('mousemove', function (e) {
            _fnpQueuePosition({
                active: true,
                x: e.clientX / window.innerWidth,
                y: e.clientY / window.innerHeight,
                id: 'mouse',
            });
        });

        function esc(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function renderChips(items) {
            if (!Array.isArray(items) || !items.length) return '';
            return `<div class="chip-row">${items.map((item) => `<span class="chip">${esc(item)}</span>`).join('')}</div>`;
        }

        function renderIframeFrame(item, extraClass = '', options = {}) {
            const title = esc(item.title || item.label || 'Visualização');
            const src = esc(item.src || '');
            const bare = !!options.bare;
            const head = bare ? '' : `<div class="frame-head"><h3>${title}</h3></div>`;
            const caption = item.caption ? `<p class="frame-caption">${esc(item.caption)}</p>` : '';
            return `
                <article class="frame-card ${extraClass}">
                    ${head}
                    <div class="frame-shell ${extraClass}"><iframe title="${title}" loading="lazy" data-src="${src}" referrerpolicy="no-referrer"></iframe></div>
                    ${caption}
                </article>
            `;
        }

        function renderOverlapTable(rows) {
            const safeRows = Array.isArray(rows) ? rows : [];
            const body = safeRows.map((row) => `
                <tr>
                    <td>${esc(row.line || '-')}</td>
                    <td>${esc(row.overlap_pct || '-')}</td>
                    <td>${esc(row.overlap_m || '-')}</td>
                    <td>${esc(row.extension_m || '-')}</td>
                    <td>${esc(row.overlap_stops || '-')} / ${esc(row.total_stops || '-')}</td>
                    <td>${esc(row.avg_freq_min || '-')}</td>
                </tr>
            `).join('');

            return `
                <table class="stats-table">
                    <thead>
                        <tr>
                            <th>Linha</th>
                            <th>Overlap (%)</th>
                            <th>Overlap (m)</th>
                            <th>Extensão (m)</th>
                            <th>Paragens</th>
                            <th>Freq. média</th>
                        </tr>
                    </thead>
                    <tbody>${body}</tbody>
                </table>
            `;
        }

        function renderOverlapStats(item) {
            const stats = item && item.stats;
            if (!stats || (!Array.isArray(stats.top5) && !Array.isArray(stats.bottom5) && !Array.isArray(stats.bottom5_stadium))) {
                return '';
            }

            const temporal = stats.temporal_summary || {};
            const summary = temporal.total_spatial_candidates ? `
                <div class="panel-note" style="margin-top:0.875rem;">
                    <strong>Resumo temporal:</strong> ${esc(temporal.temporal_overlap_pct || 0)}% das combinações espaciais passaram também o limiar temporal definido.
                </div>
            ` : '';
            const totalExtension = temporal.total_overlap_extension_fmt ? `
                <div class="panel-note" style="margin-top:0.875rem;">
                    <strong>Extensão total em overlap:</strong> ${esc(temporal.total_overlap_extension_fmt)} de linhas SMTUC coincidem, a pé, com paragens do Metrobus (soma de todas as linhas com overlap).
                </div>
            ` : '';

            return `
                <section class="stats-wrap">
                    <div class="stats-grid">
                        <article class="stats-card">
                            <h4>Top 5 maior overlap</h4>
                            ${renderOverlapTable(stats.top5 || [])}
                        </article>
                        <article class="stats-card">
                            <h4>Bottom 5 menor overlap</h4>
                            ${renderOverlapTable(stats.bottom5_stadium || stats.bottom5 || [])}
                        </article>
                    </div>
                    ${summary}
                    ${totalExtension}
                </section>
            `;
        }

        function renderPanel(item) {
            const kind = item.kind || 'hero';

            if (kind === 'hero') {
                const highlights = Array.isArray(item.highlights) ? item.highlights : [];
                return `
                    <article class="tab-panel is-active" id="panel-${esc(item.id)}" data-panel-id="${esc(item.id)}" role="tabpanel" aria-labelledby="tab-${esc(item.id)}">
                        <div class="panel-head">
                            <h2 class="panel-title">${esc(item.label)}</h2>
                            <p class="panel-desc">${esc(item.description || '')}</p>
                        </div>
                        <div class="panel-body">
                            <div class="grid-hero">
                                <div class="card hero-card">
                                    <div class="card-body">
                                        <div class="eyebrow">${esc(item.eyebrow || 'Apresentação')}</div>
                                        <h2 style="margin:0 0 0.625rem;font-size:clamp(1.8rem,3vw,3rem);line-height:1.08;">${esc(item.title || '')}</h2>
                                        <p class="lead-text">${esc(item.subtitle || '')}</p>
                                        <p class="lead-text" style="color:var(--muted);margin-bottom:0;">${esc(item.lead || '')}</p>
                                        ${renderChips(item.chips || [])}
                                    </div>
                                </div>
                                <div class="comparison-col">
                                    ${highlights.map((text) => `
                                        <div class="metric-card">
                                            <div class="metric-body">
                                                <p class="lead-text" style="margin:0;">${esc(text)}</p>
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        </div>
                    </article>
                `;
            }

            if (kind === 'methodology') {
                return `
                    <article class="tab-panel" id="panel-${esc(item.id)}" data-panel-id="${esc(item.id)}" role="tabpanel" aria-labelledby="tab-${esc(item.id)}" hidden>
                        <div class="panel-head">
                            <h2 class="panel-title">${esc(item.label)}</h2>
                            <p class="panel-desc">${esc(item.description || '')}</p>
                        </div>
                        <div class="panel-body">
                            <div class="grid-2">
                                <div class="card">
                                    <div class="card-body">
                                        <p class="lead-text">${esc(item.note || '')}</p>
                                        <div class="steps">${(item.steps || []).map((step) => `<span class="step">${esc(step)}</span>`).join('')}</div>
                                        ${renderChips(item.source_tags || [])}
                                    </div>
                                </div>
                                <div class="grid-2">
                                    ${(item.iframes || []).map((frame) => renderIframeFrame(frame, 'slim')).join('')}
                                </div>
                            </div>
                        </div>
                    </article>
                `;
            }

            if (kind === 'three-up') {
                return `
                    <article class="tab-panel" id="panel-${esc(item.id)}" data-panel-id="${esc(item.id)}" role="tabpanel" aria-labelledby="tab-${esc(item.id)}" hidden>
                        <div class="panel-head">
                            <h2 class="panel-title">${esc(item.label)}</h2>
                            <p class="panel-desc">${esc(item.description || '')}</p>
                        </div>
                        <div class="panel-body">
                            <div class="panel-note">${esc(item.note || '')}</div>
                            <div class="grid-3">
                                ${(item.iframes || []).map((frame) => renderIframeFrame(frame, 'slim')).join('')}
                            </div>
                        </div>
                    </article>
                `;
            }

            if (kind === 'overlap') {
                return `
                    <article class="tab-panel" id="panel-${esc(item.id)}" data-panel-id="${esc(item.id)}" role="tabpanel" aria-labelledby="tab-${esc(item.id)}" hidden>
                        <div class="panel-head">
                            <h2 class="panel-title">${esc(item.label)}</h2>
                            <p class="panel-desc">${esc(item.description || '')}</p>
                        </div>
                        <div class="panel-body">
                            <div class="panel-note">${esc(item.note || '')}</div>
                            <div class="grid-2">
                                ${(item.iframes || []).map((frame) => renderIframeFrame(frame, 'tall')).join('')}
                            </div>
                            ${renderOverlapStats(item)}
                        </div>
                    </article>
                `;
            }

            if (kind === 'comparison') {
                return `
                    <article class="tab-panel" id="panel-${esc(item.id)}" data-panel-id="${esc(item.id)}" role="tabpanel" aria-labelledby="tab-${esc(item.id)}" hidden>
                        <div class="panel-head">
                            <h2 class="panel-title">${esc(item.label)}</h2>
                            <p class="panel-desc">${esc(item.description || '')}</p>
                        </div>
                        <div class="panel-body">
                            <div class="panel-note">${esc(item.note || '')}</div>
                            <div class="grid-2">
                                ${(item.columns || []).map((column) => `
                                    <div class="comparison-col">
                                        <div class="comparison-heading">
                                            <h3>${esc(column.title || '')}</h3>
                                            <p>${esc(column.subtitle || '')}</p>
                                        </div>
                                        ${renderIframeFrame(column.current || {}, 'slim', { bare: true })}
                                        <div class="target-card">
                                            <h4>Versão otimizada</h4>
                                            <ul>${(column.optimized || []).map((point) => `<li>${esc(point)}</li>`).join('')}</ul>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </article>
                `;
            }

            if (kind === 'closing') {
                return `
                    <article class="tab-panel" id="panel-${esc(item.id)}" data-panel-id="${esc(item.id)}" role="tabpanel" aria-labelledby="tab-${esc(item.id)}" hidden>
                        <div class="panel-head">
                            <h2 class="panel-title">${esc(item.label)}</h2>
                            <p class="panel-desc">${esc(item.description || '')}</p>
                        </div>
                        <div class="panel-body">
                            <div class="closing-layout">
                                <div class="closing-hero">
                                    <h2>${esc(item.headline || '')}</h2>
                                    <p>O foco da apresentação é mostrar que já existe impacto mensurável e que o SMTUC pode responder com rapidez, antes de a narrativa pública da mobilidade em Coimbra ficar fechada sem esta adaptação.</p>
                                </div>
                                <div class="comparison-col">
                                    ${(item.points || []).map((point) => `
                                        <div class="closing-card">
                                            <p class="lead-text" style="margin:0;">${esc(point)}</p>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        </div>
                    </article>
                `;
            }

            if (kind === 'thanks') {
                return `
                    <article class="tab-panel" id="panel-${esc(item.id)}" data-panel-id="${esc(item.id)}" role="tabpanel" aria-labelledby="tab-${esc(item.id)}" hidden>
                        <div class="panel-head">
                            <h2 class="panel-title">${esc(item.label)}</h2>
                            <p class="panel-desc">${esc(item.description || '')}</p>
                        </div>
                        <div class="panel-body thanks-layout">
                            <div class="thanks-card">
                                <h2>${esc(item.title || 'Obrigado')}</h2>
                                <p>${esc(item.subtitle || '')}</p>
                                ${renderChips(item.contacts || [])}
                            </div>
                        </div>
                    </article>
                `;
            }

            return '';
        }

        // A parede não tem rato/teclado ao alcance do público - controlos que só funcionam por
        // clique (ex.: a caixa "Mostrar linha" do mapa de linhas sobrepostas, ver
        // lines_map.py) ficam inertes mas continuariam visíveis, confundindo quem tenta
        // "carregar" neles sem sucesso. Em vez de duplicar cada visualização numa versão
        // interativa/não-interativa, propaga-se um sinal simples por query param que cada
        // página embutida pode escolher respeitar (esconder o seu próprio controlo) ou ignorar
        // em segurança se não tiver nenhum. presentation_dashboard.html (mockups no browser
        // normal, com rato) NÃO faz este append - só este template, o da parede.
        function _fnpWithInteractiveFlag(src) {
            if (!src) return src;
            const sep = src.includes('?') ? '&' : '?';
            return `${src}${sep}interactive=0`;
        }

        function setActiveTab(tabId, focusButton = false) {
            const buttons = tabsEl.querySelectorAll('[data-tab-id]');
            const panels = panelsEl.querySelectorAll('[data-panel-id]');

            buttons.forEach((button) => {
                const active = button.dataset.tabId === tabId;
                button.setAttribute('aria-selected', active ? 'true' : 'false');
                button.tabIndex = active ? 0 : -1;
                if (active && focusButton) button.focus();
            });

            panels.forEach((panel) => {
                const active = panel.dataset.panelId === tabId;
                panel.classList.toggle('is-active', active);
                panel.hidden = !active;
                if (active) {
                    panel.querySelectorAll('iframe[data-src]').forEach((iframe) => {
                        if (!iframe.dataset.loaded) {
                            iframe.src = _fnpWithInteractiveFlag(iframe.dataset.src);
                            iframe.dataset.loaded = '1';
                        }
                    });
                }
            });

            _fnpRefreshDwellAvailability();
            _fnpRefreshActiveIframes();
        }

        function renderTabs() {
            tabsEl.innerHTML = tabs.map((item, index) => `
                <button
                    class="tab-btn"
                    type="button"
                    role="tab"
                    id="tab-${esc(item.id)}"
                    data-tab-id="${esc(item.id)}"
                    aria-controls="panel-${esc(item.id)}"
                    aria-selected="${index === 0 ? 'true' : 'false'}"
                    tabindex="${index === 0 ? '0' : '-1'}"
                >
                    ${esc(item.label)}
                </button>
            `).join('');

            panelsEl.innerHTML = tabs.map((item, index) => {
                const html = renderPanel(item);
                if (index === 0) return html;
                return html.replace('tab-panel is-active', 'tab-panel').replace(' hidden', ' hidden');
            }).join('');

            tabsEl.querySelectorAll('[data-tab-id]').forEach((button) => {
                button.addEventListener('click', () => setActiveTab(button.dataset.tabId, false));
                button.addEventListener('keydown', (event) => {
                    const key = event.key;
                    if (key !== 'ArrowLeft' && key !== 'ArrowRight' && key !== 'Home' && key !== 'End') return;

                    const currentIndex = tabs.findIndex((item) => item.id === button.dataset.tabId);
                    if (currentIndex < 0) return;

                    let nextIndex = currentIndex;
                    if (key === 'ArrowLeft') nextIndex = (currentIndex - 1 + tabs.length) % tabs.length;
                    if (key === 'ArrowRight') nextIndex = (currentIndex + 1) % tabs.length;
                    if (key === 'Home') nextIndex = 0;
                    if (key === 'End') nextIndex = tabs.length - 1;

                    event.preventDefault();
                    setActiveTab(tabs[nextIndex].id, true);
                });
            });

            setActiveTab(tabs[0].id, false);
        }

        renderTabs();
    </script>
</body>
</html>
